  const genre = (a.genres || []).sort((x, y) => y.count - x.count)[0]?.name;
  if (st.kind !== 'band') return [genre && `${genre[0].toUpperCase() + genre.slice(1)} musician`, place && `from ${place}`].filter(Boolean).join(' ') + (genre || place ? '.' : '');
  const what = `${genre ? genre[0].toUpperCase() + genre.slice(1) + ' band' : 'Band'}${place ? ` from ${place}` : ''}`;
  if (year(ls.begin)) return `${what}, formed in ${year(ls.begin)}.`;
  // Nothing else known: say what the records say ("Band with 1 release, in 1998.").
  const ys = (st.releases || []).map(r => year(r['first-release-date'])).filter(Boolean).sort(), n = st.releases?.length || 0;
  if (n) return `${what} with ${n} release${n === 1 ? '' : 's'}${ys.length ? `, ${ys[0] === ys.at(-1) ? 'in ' + ys[0] : ys[0] + '–' + ys.at(-1)}` : ''}.`;
  return genre || place ? what + '.' : '';
}
function infoCol(st, i) {
  const tiers = memberTiers(st);
  const a = st.artist, ls = a['life-span'] || {}, band = st.kind === 'band';
  const place = st.place || (a['begin-area'] || a.area)?.name || '';

  // "Current" only counts stints with a start date and no end; MusicBrainz marks unknown ends as not-ended.

    ['Members', total ? (tiers ? `${tiers.core.length} core · ${tiers.others.length} other${tiers.others.length === 1 ? '' : 's'}` : `${total}${current ? ` · ${current} current` : ''}`) : 'None listed'],

    ${genres.length ? `<div>${genres.map(g => `<span class="tag">${esc(g.name)}</span>`).join('')}</div>` : ''}
    <button class="fwdcol" data-col="1">${band ? 'Members' : 'Bands'} · ${total} ›</button>

// Band lists read like a career: oldest first, years beside the name. When a person's stint has no dates, the band's
// own years (Wikidata inception / dissolution, one query for the lot) place it, shown greyed out.
const bandYears = new Map();   // MusicBrainz band id -> { first, txt }
async function fetchBandYears(list) {
  const ids = [...new Set(list.filter(l => !l.span && !l.id.includes(':') && !bandYears.has(l.id)).map(l => l.id))].slice(0, 60);
  if (!ids.length) return false;
  ids.forEach(id => bandYears.set(id, null));
  const q = `SELECT ?mbid ?s ?e WHERE { VALUES ?mbid { ${ids.map(i => `"${i}"`).join(' ')} } ?b wdt:P434 ?mbid.
    OPTIONAL { ?b wdt:P571 ?s } OPTIONAL { ?b wdt:P576 ?e } }`;
  const d = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q));
  for (const b of d.results.bindings) {
    const s = b.s?.value.slice(0, 4), e = b.e?.value.slice(0, 4);
    if (s) bandYears.set(b.mbid.value, { first: s, txt: `${s}–${e || ''}` });
  }

function yearsOf(l) {
  if (l.span) return { first: l.first, html: l.span.endsWith('now') ? `${esc(l.span.slice(0, -3))}<span class="now">now</span>` : esc(l.span) };
  const b = bandYears.get(l.id);
  return b ? { first: b.first, html: esc(b.txt), band: true } : { first: '9999', html: '' };

const byCareer = (a, b) => yearsOf(a).first.localeCompare(yearsOf(b).first) || a.name.localeCompare(b.name);
function bandName(l) {
  const y = yearsOf(l);
  return `${esc(l.name)}${y.html ? ` <span class="yr${y.band ? ' fb' : ''}"${y.band ? ' title="The band’s own years (no dates for this stint)"' : ''}>${y.html}</span>` : ''}`;
}
const roleOnly = r => esc(r.instruments.slice(0, 2).join(', ') || r.note || '');

  const span = r.span.endsWith('now') ? `${esc(r.span.slice(0, -3))}<span class="now">now</span>` : esc(r.span);

/* Core members vs everyone else. Sources list every name equally (Swell: 12 people), but a person asking "who was in

   band's life they were part of; everyone else sits in a folded group. Bands under 5 members aren't split. */

  const bc = st.bandCredits?.state === 'done' && st.bandCredits.credited >= 2 ? st.bandCredits : null;
  const plays = id => bc ? bc.perRecord.filter(x => x.players.includes(id)).length : 0;
  const tenure = r => r.periods.reduce((n, p) => {
    const b = toYear(p.begin); if (b == null) return n;
    const e = p.end ? toYear(p.end, true) : p.ended ? b + 1 : NOW;
    return n + Math.max(0, e - b);

    const n = plays(r.id), t = tenure(r), share = bc ? n / bc.credited : 0, f = founder(r);

      <div class="txt"><div class="nm">${band ? esc(r.name) : bandName(r)}</div><div class="meta">${[band ? rowMeta(r) : roleOnly(r), extra].filter(Boolean).join(' · ')}</div></div>${badge}</div>`;
  };

    rows = tiers.core.map(r => row(r)).join('') +

    `<div class="row${n.id === nextId ? ' sel' : ''}" data-go="${esc(n.id)}"><div class="txt"><div class="nm">${esc(n.name)}</div><div class="meta">${n.id.startsWith('discogs:') ? 'via Discogs' : 'stage name'}</div></div></div>`).join('');

  if (!sel) return `<div class="col sub empty"><div class="hint">${band
    ? 'Pick a member to see every other band they’ve played in.' : 'Pick a band to see who else played in it.'}</div></div>`;
  const links = st.links.get(sel.id);

  else {
    // For each of this member's other bands, which *other* members of the current band also played there.
    const rows = links.map(l => ({ l, also: band ? st.rels.filter(r => r.id !== sel.id && st.links.get(r.id)?.some(x => x.id === l.id)) : [] }))

    <a class="open" data-go="${sel.id}">Open ›</a></div><div class="rows">${body}</div></div>`;
}

// Line the third column up with the selected row, then draw the bracket connectors from the sketch.
function layoutStage(i) {
  const el = document.getElementById('track')?.children[i];
  if (!el) return;
  const sub = el.querySelector('.col.sub .rows'), selRow = el.querySelector('.col.list .row.sel');
  const listRows = el.querySelector('.col.list .rows');
  if (sub && selRow && !document.getElementById('nav').classList.contains('mobile')) {
    sub.style.paddingTop = '0px';
    const room = listRows.offsetTop + listRows.offsetHeight - (sub.offsetTop + sub.offsetHeight);
    sub.style.paddingTop = Math.max(0, Math.min(selRow.offsetTop - sub.offsetTop, room)) + 'px';
  }
  el.querySelector('svg.links')?.remove();
  const S = el.getBoundingClientRect();
  const box = r => ({ l: r.left - S.left, r: r.right - S.left, y: (r.top + r.bottom) / 2 - S.top });
  const bracket = (x0, y0, rows) => {
    if (!rows.length) return '';
    const ys = rows.map(r => box(r.getBoundingClientRect()).y), bx = box(rows[0].getBoundingClientRect()).l + 10;
    return `M${x0},${y0}H${bx}M${bx},${Math.min(y0, ys[0])}V${Math.max(y0, ys.at(-1))}` + ys.map(y => `M${bx},${y}h14`).join('');
  };
  let d = '', hot = '';
  const title = el.querySelector('.info .title');
  if (title) {
    const rects = title.getClientRects(), t = box(rects[rects.length - 1]);

  if (selRow) hot = bracket(box(selRow.getBoundingClientRect()).r, box(selRow.getBoundingClientRect()).y, [...el.querySelectorAll('.col.sub .row')]);
  el.insertAdjacentHTML('afterbegin', `<svg class="links" width="${S.width}" height="${S.height}"><path class="ln" d="${d}"/><path class="hot" d="${hot}"/></svg>`);

/* Photo: Wikidata links MusicBrainz IDs (P434) to a Commons image (P18). Photos only — logos are usually SVG/PNG. */
async function artistImage(mbid) {
  const e = await wikidataEntity(mbid);
  if (!e) return null;
  let file = e.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
  if (!file && e.sitelinks?.enwiki) {
    const pg = Object.values((await getJSON(`https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&prop=pageimages&piprop=name&titles=${encodeURIComponent(e.sitelinks.enwiki.title)}`)).query.pages)[0];
    file = pg?.pageimage;
  }
  if (!file || !/\.jpe?g$/i.test(file)) return null;
  // Ask for a standard thumbnail width: those are pre-rendered on Wikimedia's CDN, custom widths take ~15s.
  const info = Object.values((await getJSON(`https://commons.wikimedia.org/w/api.php?format=json&origin=*&action=query&prop=imageinfo&iiprop=url&iiurlwidth=960&titles=${encodeURIComponent('File:' + file)}`)).query.pages)[0];
  const src = info?.imageinfo?.[0]?.thumburl;
  if (!src) return null;
  await preload(src);  // show it only once it's ready
  return { src, credit: info.imageinfo[0].descriptionurl };
}

/* City plus its state/region, e.g. "Hermosa Beach, California". MusicBrainz nests areas
   (city → county → state → country), so walk up a few levels to the first subdivision. */
async function resolvePlace(artist) {
  const area = artist['begin-area'] || artist.area;
  if (!area || ['Country', 'Subdivision'].includes(area.type)) return area?.name || '';
  let at = area;
  try {
    for (let hop = 0; hop < 4; hop++) {
      const a = await mb(`area/${at.id}?inc=area-rels`, { priority: true });
      const parent = (a.relations || []).find(r => r.type === 'part of' && r.direction === 'backward')?.area;
      if (!parent) break;
      if (parent.type === 'Subdivision' || parent.type === 'Country') return `${area.name}, ${parent.name}`;
      at = parent;
    }
  } catch {}
  return area.name;
}

/* ---------- Lineup timeline ---------- */
const ROLES = [
  { name: 'Vocals', color: '#f25f5c', test: a => /vocal|singer|rap|\bmc\b|voice/.test(a) },
  { name: 'Guitar', color: '#ffb238', test: a => /guitar|banjo|mandolin/.test(a) && !/bass/.test(a) },
  { name: 'Bass', color: '#5cc8ff', test: a => /bass/.test(a) },
  { name: 'Drums', color: '#7be495', test: a => /drum|percussion|membranophone|idiophone|cymbal/.test(a) },
  { name: 'Keys', color: '#b58cff', test: a => /key|piano|synth|organ|electronic/.test(a) },
  { name: 'Other', color: '#8b91a1', test: () => true },
];
const NON_ROLES = ['original', 'founder', 'additional', 'minor', 'guest', 'lead', 'solo', 'background', 'touring'];
// Main role first: lead vocals, then instruments, then backing vocals.
function rolesOf(attrs) {
  const ranked = new Map();
  for (const a of attrs.map(x => x.toLowerCase()).filter(x => !NON_ROLES.includes(x))) {
    const i = ROLES.findIndex(r => r.test(a));
    const rank = /lead/.test(a) ? -1 : /background|backing|additional/.test(a) ? 10 + i : i;
    ranked.set(ROLES[i], Math.min(rank, ranked.get(ROLES[i]) ?? 99));
  }
  const list = [...ranked].sort((a, b) => a[1] - b[1]).map(([r]) => r);
  return list.length ? list : [ROLES.at(-1)];
}
// '1987' -> 1987.0 (or 1988.0 as an end), '1987-05' -> 1987.33, etc.
function toYear(date, isEnd) {
  if (!date) return null;
  const [y, m, d] = date.split('-').map(Number);
  if (!m) return y + (isEnd ? 1 : 0);
  if (!d) return y + (m - (isEnd ? 0 : 1)) / 12;
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const NOW = (() => { const d = new Date(); return d.getFullYear() + d.getMonth() / 12 + d.getDate() / 365; })();

function rootSpan() {
  const ls = state.artist['life-span'] || {};
  // For a band, missing dates fall back to the band's own lifespan; for a person, their birth date is meaningless here.
  return { rootStart: kindOf(state.artist.type) === 'band' ? toYear(ls.begin) : null, rootEnd: ls.ended ? toYear(ls.end, true) ?? NOW : NOW };
}
function stintsOf(r) {
  const { rootStart, rootEnd } = rootSpan();
  return r.periods.filter(p => p.begin || p.end).map(p => {
    const start = toYear(p.begin) ?? rootStart ?? toYear(p.end) - 1;
    const end = toYear(p.end, true) ?? rootEnd;
    // No role on the stint or the member: use what they play on the records, so the bar isn't grey "Other".
    return { start, end: Math.max(end, start + 1 / 12), p, roles: rolesOf(p.attrs.length ? p.attrs : r.attrs.size ? [...r.attrs] : r.instruments || []) };
  });
}
function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!el || !state.artist || state.artist.type === 'Album') return;   // album pages show the tracklist here
  const here = stages.get(trail[cur]?.id);
  document.getElementById('tlTitle').textContent = `${kindOf(state.artist.type) === 'band' ? 'Lineup timeline' : 'Band timeline'} · ${state.artist.name}`;
  if (!state.rels.length) {
    el.innerHTML = `<span class="muted">MusicBrainz has no ${kindOf(state.artist.type) === 'band' ? 'member' : 'band membership'} data for this artist yet.</span>`;
    document.getElementById('tlegend').innerHTML = '';
    return;
  }
  const artist = state.artist, isBand = kindOf(artist.type) === 'band';
  const { rootStart, rootEnd } = rootSpan();

  const rows = [], undated = [];
  for (const r of state.rels) {
    const bars = stintsOf(r);
    if (bars.length) rows.push({ r, bars, first: Math.min(...bars.map(b => b.start)) }); else undated.push(r);
  }
  rows.sort((a, b) => a.first - b.first || a.r.name.localeCompare(b.r.name));

  const albums = state.releases.filter(rg => relType(rg) === 'Album' && rg['first-release-date'])
    .map(rg => ({ rg, at: toYear(rg['first-release-date']) + 1 / 24 }));
  // Undated members go underneath as their own rows.
  undated.sort((a, b) => a.name.localeCompare(b.name)).forEach(r => rows.push({ r, bars: [], undated: true }));
  const all = rows.flatMap(r => r.bars);
  // With no dated stints at all, fall back to the band's own lifespan for the axis (or drop the axis).
  const y0 = Math.floor(Math.min(...all.map(b => b.start), rootStart ?? Infinity));
  // Run the axis to today only if someone's still in the band (or the band itself is); otherwise stop at the last stint.
  // (MusicBrainz often just leaves a band's end date blank, so "not ended" alone doesn't mean still active.)
  const open = state.rels.some(r => r.periods.some(p => (p.begin || p.end) && !p.end && !p.ended));
  const y1 = Math.ceil(Math.max(...all.map(b => b.end), open || (state.artist['life-span'] || {}).ended ? rootEnd : -Infinity));
  const hasAxis = isFinite(y0) && isFinite(y1) && y1 > y0;
  const W = el.clientWidth, labelW = Math.min(170, W * 0.32), rowH = 26, axisH = hasAxis ? 26 : 4;
  const H = rows.length * rowH + axisH;
  const x = d3.scaleLinear(hasAxis ? [y0, y1] : [0, 1], [labelW, W - 4]);

  el.innerHTML = '';
  const svg = d3.select(el).append('svg').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`);
  const ticks = hasAxis ? x.ticks(Math.min(y1 - y0, Math.floor((W - labelW) / 55))).filter(Number.isInteger) : [];
  svg.append('g').attr('class', 'grid').selectAll('line').data(ticks).join('line')
    .attr('x1', x).attr('x2', x).attr('y1', 0).attr('y2', H - axisH + 4);
  svg.append('g').attr('class', 'axis').selectAll('text').data(ticks).join('text')
    .attr('x', x).attr('y', H - 6).attr('text-anchor', 'middle').text(d => d);

  const tip = document.getElementById('tip'), wrap = el.parentElement;
  const showTip = (ev, html) => {
    tip.innerHTML = html; tip.style.display = 'block';
    const b = wrap.getBoundingClientRect(), tw = tip.offsetWidth;
    tip.style.left = Math.min(ev.clientX - b.left + 14, b.width - tw - 8) + 'px';
    tip.style.top = (ev.clientY - b.top + 14) + 'px';
  };
  const hideTip = () => tip.style.display = 'none';

  const row = svg.append('g').selectAll('g').data(rows).join('g').attr('transform', (d, i) => `translate(0,${i * rowH})`);
  row.append('text').attr('class', 'name').attr('x', labelW - 12).attr('y', rowH / 2).attr('dy', '.35em')
    .attr('text-anchor', 'end').text(d => d.r.name.length > 24 ? d.r.name.slice(0, 23) + '…' : d.r.name)
    .on('click', (ev, d) => selectMember(d.r.id));
  const bar = row.selectAll('g.bar').data(d => d.bars.map(b => ({ ...b, r: d.r }))).join('g').attr('class', 'bar')
    .on('mousemove', (ev, b) => showTip(ev, `<b>${esc(b.r.name)}</b><br>${esc(fmtPeriod(b.p))}${b.p.fromRecords ? ' <span class="muted">(from album credits)</span>' : ''}<br>
        <span class="muted">${esc(b.p.attrs.filter(a => !['original'].includes(a)).join(', ') || [...b.r.attrs].join(', ') || 'role unknown')}</span>`))
    .on('mouseleave', hideTip).on('click', (ev, b) => selectMember(b.r.id));
  bar.append('rect').attr('x', b => x(b.start)).attr('width', b => Math.max(3, x(b.end) - x(b.start)))
    .attr('y', 5).attr('height', rowH - 10).attr('rx', 3).attr('fill', b => b.roles[0].color).attr('fill-opacity', b => b.p.fromRecords ? .45 : 1);
  const und = row.filter(d => d.undated);
  und.append('line').attr('x1', labelW).attr('x2', W - 4).attr('y1', rowH / 2).attr('y2', rowH / 2)
    .attr('stroke', 'var(--muted)').attr('stroke-opacity', .5).attr('stroke-dasharray', '4 4');
  und.append('rect').attr('x', labelW).attr('y', 4).attr('width', 104).attr('height', rowH - 8).attr('fill', 'var(--panel)');
  und.append('text').attr('x', labelW + 4).attr('y', rowH / 2).attr('dy', '.35em').attr('fill', 'var(--muted)')
    .attr('font-size', 12).attr('font-style', 'italic').text('dates unknown');
  // Secondary role as a stripe through the middle, like Wikipedia's lineup charts.
  bar.filter(b => b.roles[1]).append('rect').attr('x', b => x(b.start)).attr('width', b => Math.max(3, x(b.end) - x(b.start)))
    .attr('y', rowH / 2 - 2).attr('height', 4).attr('fill', b => b.roles[1].color);

  const alb = svg.append('g').selectAll('g').data(hasAxis ? albums.filter(a => a.at >= y0 && a.at <= y1) : []).join('g').attr('class', 'album')
    .on('mousemove', (ev, a) => showTip(ev, `<b>${esc(a.rg.title)}</b><br><span class="muted">Album · ${esc(a.rg['first-release-date'])}</span>`))
    .on('mouseleave', hideTip);
  alb.append('line').attr('class', 'vis').attr('x1', a => x(a.at)).attr('x2', a => x(a.at)).attr('y1', 0).attr('y2', H - axisH + 4);
  alb.append('line').attr('x1', a => x(a.at)).attr('x2', a => x(a.at)).attr('y1', 0).attr('y2', H - axisH + 4)
    .attr('stroke', 'transparent').attr('stroke-width', 8);

  const used = ROLES.filter(R => rows.some(r => r.bars.some(b => b.roles.includes(R))));
  document.getElementById('tlegend').innerHTML = used.map(R => `<span><i style="background:${R.color}"></i>${R.name}</span>`).join('')
    + (albums.length && hasAxis ? `<span><i style="background:none;border-left:1px dashed #fff8;border-radius:0;width:1px"></i>Studio album</span>` : '')
    + (used.length ? `<span>Center stripe = second role</span>` : '')
    + (rows.some(r => r.bars.some(b => b.p.fromRecords)) ? '<span>Faded = years from album credits</span>' : '');
}
function fmtPeriod(p) {
  const b = p.begin || '?', e = p.end || (p.ended ? '?' : 'present');
  return `${b} – ${e}`;
}
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderTimeline(); renderNav(); }, 150); });

/* ---------- Discography ---------- */
const TYPES = ['Album', 'EP', 'Single', 'Live', 'Compilation', 'Other', 'All'];
const LABELS = { Album: 'Albums', EP: 'EPs', Single: 'Singles', Live: 'Live', Compilation: 'Compilations', Other: 'Other', All: 'All' };
function relType(rg) {
  const sec = rg['secondary-types'] || [];
  if (sec.includes('Live')) return 'Live';
  if (sec.includes('Compilation')) return 'Compilation';
  if (sec.length) return 'Other';
  return ['Album', 'EP', 'Single'].includes(rg['primary-type']) ? rg['primary-type'] : 'Other';
}
async function loadReleases(st, myGen) {
  let all = [];
  try {
    if (st.artist.src === 'mb') for (let offset = 0; offset < 1000; offset += 100) {
      const d = await mb(`release-group?artist=${st.id}&limit=100&offset=${offset}`, { gen: myGen });
      all.push(...d['release-groups']);
      if (all.length >= d['release-group-count'] || !d['release-groups'].length) break;
    }
    if (!all.length && st.discogsId) all = await discogsReleases(st.discogsId, myGen);
  } catch (e) { if (e.message === 'stale') return; }
  st.releases = all.sort((a, b) => (a['first-release-date'] || '9999').localeCompare(b['first-release-date'] || '9999'));
  refreshStage(st.id);  // album count in the info column
  maybeBandCredits(st);
  if (myGen !== gen) return;
  state.releases = st.releases;
  if (!state.releases.some(r => relType(r) === 'Album')) state.filter = 'All';
  renderReleases();
  renderTimeline();  // adds album markers
}
async function discogsReleases(did, myGen) {
  const out = [];
  for (let page = 1; page <= 5; page++) {
    const d = await dg(`artists/${did}/releases?sort=year&sort_order=asc&per_page=100&page=${page}`, { gen: myGen });
    for (const r of d.releases || []) {
      if (r.role !== 'Main') continue;
      const f = r.format || '';
      out.push({ id: `dg-${r.type}-${r.id}`, src: 'discogs', dgType: r.type, dgId: r.id, title: r.title, thumb: r.thumb || '',
        'first-release-date': r.year ? String(r.year) : '',
        'primary-type': /\bEP\b/.test(f) ? 'EP' : /single|7"/i.test(f) && !/\bLP\b/.test(f) ? 'Single' : 'Album',
        'secondary-types': /comp/i.test(f) ? ['Compilation'] : [] });
    }
    if (page >= (d.pagination?.pages || 1)) break;
  }
  return out;
}
function renderReleases() {
  const el = document.getElementById('releases'); if (!el) return;
  const counts = Object.fromEntries(TYPES.map(t => [t, t === 'All' ? state.releases.length : state.releases.filter(r => relType(r) === t).length]));
  document.getElementById('relCount').textContent = state.releases.length;
  document.getElementById('filters').innerHTML = TYPES.filter(t => counts[t]).map(t =>
    `<button class="${t === state.filter ? 'on' : ''}" data-t="${t}">${LABELS[t]} ${counts[t]}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b => b.onclick = () => { state.filter = b.dataset.t; renderReleases(); });
  const list = state.releases.filter(r => state.filter === 'All' || relType(r) === state.filter);
  const here = stages.get(trail[cur]?.id), onAlbum = here?.kind === 'album' ? here.rg?.id : null;
  el.innerHTML = list.length ? list.map(r => `<div class="rel"><button data-rg="${r.id}"${r.id === onAlbum ? ' class="on"' : ''}>
      <div class="cover">${esc(r.title[0] || '')}<img loading="lazy" alt="" data-title="${esc(r.title)}" src="${r.src === 'discogs' ? esc(r.thumb || 'data:,') : `https://coverartarchive.org/release-group/${r.id}/front-250`}" onerror="coverFallback(this, '${r.id}')"></div>
      <div class="t">${esc(r.title)}</div><div class="y">${year(r['first-release-date']) || '—'} · ${esc(relType(r))}</div></button></div>`).join('')
    : '<span class="muted">No releases listed.</span>';
  el.querySelectorAll('[data-rg]').forEach(b => b.onclick = e => { e.stopPropagation(); openAlbumStage(state.releases.find(r => r.id === b.dataset.rg)); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  const dl = document.getElementById('discogsLink');
  if (dl) dl.textContent = discogsToken() ? 'Discogs token on' : '+ Discogs token';
}

/* ---------- Album overlay ----------
   Pulls from MusicBrainz (release, tracks, label), Wikidata (producer, studio, sequence),
   Wikipedia (overview), Cover Art Archive (gallery) and iTunes (exact Apple Music link). */
const albumEl = document.getElementById('album'), sheet = document.getElementById('sheet');
let albumSeq = 0;
const fmtLen = ms => ms ? `${Math.floor(ms / 60000)}:${String(Math.round(ms / 1000) % 60).padStart(2, '0')}` : '';
const fmtDate = d => {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return m ? new Date(y, m - 1, day || 1).toLocaleDateString('en-US', { year: 'numeric', month: 'long', ...(day ? { day: 'numeric' } : {}) }) : y;
};
const getJSON = async u => {
  const hit = await diskCache.get(u);
  if (hit !== undefined) return hit;
  pending++; batch++; setStatus();
  try {
    const r = await fetch(u); if (!r.ok) throw new Error(r.status);
    const d = await r.json(); diskCache.set(u, d); return d;
  } finally { pending--; setStatus(); }
};
const WIKI = 'https://en.wikipedia.org/w/api.php?format=json&origin=*&';
const WD = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';

function lineupAt(dateStr) {
  if (kindOf(state.artist.type) !== 'band' || !dateStr) return [];
  const t = toYear(dateStr) + 1 / 24;
  return state.rels.filter(r => stintsOf(r).some(b => b.start <= t && t < b.end));
}

async function openAlbum(rg) {
  const seq = ++albumSeq, live = () => seq === albumSeq && albumEl.classList.contains('open');
  const artist = state.artist.name, q = `${artist} ${rg.title}`;
  const card = document.querySelector(`[data-rg="${rg.id}"] .cover img`);
  const lineup = lineupAt(rg['first-release-date']);
  sheet.innerHTML = `<button class="x" onclick="closeAlbum()" aria-label="Close">✕</button>
    <div><div class="bigcover" id="bigcover">${esc(rg.title[0] || '')}${card ? `<img src="${esc(card.src.replace('front-250', 'front-500'))}" alt="">` : ''}</div>
      <div class="gallery" id="gallery"></div></div>
    <div>
      <h3>${esc(rg.title)}</h3>
      <div class="by"><a onclick="closeAlbum()">${esc(artist)}</a> · ${esc(relType(rg))} · ${esc(year(rg['first-release-date']) || 'date unknown')}</div>
      <div class="listen">
        <a class="am" id="amLink" target="_blank" rel="noopener" href="https://music.apple.com/us/search?term=${encodeURIComponent(q)}">Apple Music</a>
        <a class="sp" id="spLink" target="_blank" rel="noopener" href="https://open.spotify.com/search/${encodeURIComponent(q)}">Spotify</a>
      </div>
      <div class="facts" id="facts"><div><small>Released</small>${esc(fmtDate(rg['first-release-date']) || '—')}</div></div>
      <div class="about" id="about"><div class="skel">Looking for the story behind this record…</div></div>
      ${lineup.length ? `<h4>Lineup at the time</h4><div class="chips">${lineup.map(r =>
        `<span class="chip person" data-id="${r.id}">${esc(r.name)}</span>`).join('')}</div>` : ''}
      <h4>Tracklist</h4><ol class="tracks" id="tracks"><li class="skel">Loading…</li></ol>
    </div>`;
  sheet.querySelectorAll('.chip[data-id]').forEach(c => c.onclick = () => { closeAlbum(); selectMember(c.dataset.id); });
  albumEl.classList.add('open'); albumEl.scrollTop = 0;
  document.body.style.overflow = 'hidden';

  const facts = {};  // label -> html, rendered in a fixed order as data arrives
  const setFact = (k, v) => { if (!v || !live()) return; facts[k] = v; renderFacts(rg, facts); };

  // Apple Music: exact album link when iTunes has it.
  itunesAlbum(artist, rg.title).then(hit => { if (hit && live()) document.getElementById('amLink').href = hit.collectionViewUrl; }).catch(() => {});

  if (rg.src === 'discogs') return loadDiscogsAlbum(rg, seq, live, setFact);

  // MusicBrainz: pick the earliest official release for tracks/label, and the best-illustrated one for the gallery.
  let rgInfo;
  (async () => {
    const { releases = [] } = await mb(`release?release-group=${rg.id}&limit=100`, { priority: true });
    const official = releases.filter(r => r.status === 'Official');
    const pool = official.length ? official : releases;
    const first = [...pool].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'))[0];
    const arty = [...releases].sort((a, b) => (b['cover-art-archive']?.count || 0) - (a['cover-art-archive']?.count || 0))[0];
    if (arty?.['cover-art-archive']?.count) loadGallery(arty.id, seq);
    if (!first) { if (live()) document.getElementById('tracks').innerHTML = '<li class="skel">No tracklist on file.</li>'; return; }
    const rel = await mb(`release/${first.id}?inc=recordings+labels+url-rels`, { priority: true });
    if (!live()) return;
    renderTracks(rel.media || []);
    const total = (rel.media || []).flatMap(m => m.tracks || []).reduce((n, t) => n + (t.length || 0), 0);
    setFact('Length', total ? `${Math.round(total / 60000)} min · ${(rel.media || []).reduce((n, m) => n + (m['track-count'] || 0), 0)} tracks` : '');
    setFact('Label', esc([...new Set((rel['label-info'] || []).map(l => l.label?.name).filter(Boolean))].join(', ')));
    for (const r of rel.relations || []) {
      const u = r.url?.resource || '';
      if (u.includes('open.spotify.com/album')) document.getElementById('spLink').href = u;
      if (/music\.apple\.com|itunes\.apple\.com/.test(u)) document.getElementById('amLink').href = u;
    }
  })().catch(() => { if (live()) document.getElementById('tracks').innerHTML = '<li class="skel">Couldn\'t load the tracklist.</li>'; });
  // Queued after (so it runs before, as priority requests go to the front) — the Wikipedia chain is the slowest.
  rgInfo = mb(`release-group/${rg.id}?inc=url-rels+genres`, { priority: true });

  // Wikidata facts + Wikipedia overview.
  (async () => {
    const info = await rgInfo;
    if (!live()) return;
    setFact('Genre', esc((info.genres || []).sort((a, b) => b.count - a.count).slice(0, 3).map(g => g.name).join(', ')));
    const wdUrl = (info.relations || []).find(r => r.type === 'wikidata')?.url?.resource;
    let wikiTitle = null;
    if (wdUrl) {
      const qid = wdUrl.split('/').pop();
      const ent = (await getJSON(`${WD}action=wbgetentities&ids=${qid}&props=claims|sitelinks&sitefilter=enwiki`)).entities[qid];
      wikiTitle = ent.sitelinks?.enwiki?.title;
      const ids = p => (ent.claims?.[p] || []).map(c => c.mainsnak?.datavalue?.value?.id).filter(Boolean);
      const want = { Producer: ids('P162'), 'Recorded at': ids('P483'), Genre: ids('P136').slice(0, 3), 'Preceded by': ids('P155'), 'Followed by': ids('P156') };
      const all = [...new Set(Object.values(want).flat())].slice(0, 50);
      if (all.length) {
        const labels = (await getJSON(`${WD}action=wbgetentities&ids=${all.join('|')}&props=labels&languages=en`)).entities;
        const name = id => labels[id]?.labels?.en?.value;
        for (const [k, list] of Object.entries(want)) {
          const names = list.map(name).filter(Boolean);
          if (!names.length) continue;
          // Link preceding/following albums back into the overlay when they're in this discography.
          setFact(k, names.map(n => {
            const hit = /by$/.test(k) && state.releases.find(r => norm(r.title) === norm(n));
            return hit ? `<a data-open="${hit.id}">${esc(n)}</a>` : esc(n);
          }).join(', '));
        }
      }
    }
    if (!wikiTitle) wikiTitle = await guessWikiTitle(artist, rg.title);
    await renderAbout(wikiTitle, live);
  })().catch(() => { if (live()) document.getElementById('about').innerHTML = ''; });
}

async function renderAbout(wikiTitle, live) {
  {
    if (!live()) return;
    const about = document.getElementById('about');
    if (!wikiTitle) { about.innerHTML = ''; return; }
    const page = Object.values((await getJSON(`${WIKI}action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(wikiTitle)}`)).query.pages)[0];
    const paras = (page.extract || '').split('\n').map(p => p.trim()).filter(p => p.length > 40);
    if (!live() || !paras.length) { about.innerHTML = ''; return; }
    const url = `https://en.wikipedia.org/wiki/${encodeURIComponent(page.title.replace(/ /g, '_'))}`;
    about.innerHTML = `<h4 style="margin-top:0">About</h4>${paras.map((p, i) => `<p${i > 1 ? ' hidden' : ''}>${esc(p)}</p>`).join('')}
      ${paras.length > 2 ? '<p><a class="more" href="#" onclick="this.parentElement.parentElement.querySelectorAll(\'p[hidden]\').forEach(p=>p.hidden=false);this.parentElement.remove();return false">Read more</a></p>' : ''}
      <div class="src">From <a href="${url}" target="_blank" rel="noopener">Wikipedia</a>, CC BY-SA</div>`;
  }
}

const durMs = d => { if (!d) return 0; const p = d.split(':').map(Number); return p.reduce((n, x) => n * 60 + (x || 0), 0) * 1000; };
async function loadDiscogsAlbum(rg, seq, live, setFact) {
  guessWikiTitle(state.artist.name, rg.title).then(t => renderAbout(t, live))
    .catch(() => { if (live()) document.getElementById('about').innerHTML = ''; });
  try {
    const m = await dg(`${rg.dgType === 'master' ? 'masters' : 'releases'}/${rg.dgId}`, { priority: true });
    // A master has the tracklist and images; its main release has the label and credits.
    const rel = rg.dgType === 'master' && m.main_release ? await dg(`releases/${m.main_release}`, { priority: true }) : m;
    if (!live()) return;
    const tracks = (m.tracklist || []).filter(t => t.type_ === 'track');
    renderTracks([{ tracks: tracks.map(t => ({ number: t.position, title: t.title, length: durMs(t.duration) })) }]);
    const total = tracks.reduce((n, t) => n + durMs(t.duration), 0);
    if (tracks.length) setFact('Length', `${total ? Math.round(total / 60000) + ' min · ' : ''}${tracks.length} tracks`);
    setFact('Label', esc([...new Set((rel.labels || []).map(l => cleanDgName(l.name)))].join(', ')));
    setFact('Producer', esc([...new Set((rel.extraartists || []).filter(x => /producer/i.test(x.role)).map(x => cleanDgName(x.name)))].join(', ')));
    setFact('Genre', esc([...(m.styles || []), ...(m.genres || [])].slice(0, 3).join(', ')));
    const imgs = (m.images?.length ? m.images : rel.images) || [];
    showGallery(imgs.filter(i => i.uri).map(i => ({ full: i.uri, thumb: i.uri150 || i.uri, title: i.type })), seq);
  } catch { if (live()) document.getElementById('tracks').innerHTML = '<li class="skel">Couldn\'t load the tracklist.</li>'; }
}

// When MusicBrainz has no Wikidata link, search Wikipedia but only accept a page that is clearly this album.
async function guessWikiTitle(artist, title) {
  const res = await getJSON(`${WIKI}action=query&list=search&srlimit=3&srsearch=${encodeURIComponent(`"${title}" ${artist} album`)}`);
  const hit = res.query.search.find(h => norm(h.title).startsWith(norm(title)) && norm(h.snippet.replace(/<[^>]+>/g, '')).includes(norm(artist)));
  return hit?.title || null;
}

const FACT_ORDER = ['Released', 'Label', 'Length', 'Producer', 'Recorded at', 'Genre', 'Preceded by', 'Followed by'];
function renderFacts(rg, facts) {
  const el = document.getElementById('facts');
  const all = { Released: esc(fmtDate(rg['first-release-date']) || '—'), ...facts };
  el.innerHTML = FACT_ORDER.filter(k => all[k]).map(k => `<div><small>${k}</small>${all[k]}</div>`).join('');
  el.querySelectorAll('[data-open]').forEach(a => a.onclick = () => openAlbum(state.releases.find(r => r.id === a.dataset.open)));
}
function renderTracks(media) {
  const el = document.getElementById('tracks');
  const multi = media.length > 1;
  el.innerHTML = media.map((m, i) => (multi ? `<li class="disc">${esc(m.format || 'Disc')} ${i + 1}${m.title ? ' · ' + esc(m.title) : ''}</li>` : '') +
    (m.tracks || []).map(t => `<li><span>${esc(t.number)}</span><span>${esc(t.title)}</span><span>${fmtLen(t.length)}</span></li>`).join('')).join('')
    || '<li class="skel">No tracklist on file.</li>';
}
async function loadGallery(releaseId, seq) {
  const { images = [] } = await getJSON(`https://coverartarchive.org/release/${releaseId}`);
  const front = images.find(i => i.front) || images[0];
  showGallery([front, ...images.filter(i => i !== front)].filter(Boolean).map(i => ({
    full: i.thumbnails?.['500'] || i.thumbnails?.large || i.image, thumb: i.thumbnails?.small || i.thumbnails?.['250'] || i.image,
    title: (i.types || []).join(', ') })), seq);
}
function showGallery(list, seq) {
  if (seq !== albumSeq || !list.length) return;
  const big = document.getElementById('bigcover'), gal = document.getElementById('gallery');
  const show = k => {
    big.querySelector('img')?.remove();
    const i = new Image(); i.alt = ''; i.src = list[k].full; big.appendChild(i);
    gal.querySelectorAll('img').forEach((t, j) => t.classList.toggle('on', j === k));
  };
  if (!big.querySelector('img')) show(0);
  if (list.length < 2) return;
  gal.innerHTML = list.slice(0, 15).map(i => `<img loading="lazy" src="${esc(i.thumb)}" title="${esc(i.title || '')}" alt="">`).join('');
  gal.querySelectorAll('img').forEach((t, k) => t.onclick = () => show(k));
  gal.querySelector('img').classList.add('on');
}
function closeAlbum() { albumEl.classList.remove('open'); document.body.style.overflow = ''; albumSeq++; }
albumEl.addEventListener('click', e => { if (e.target === albumEl) closeAlbum(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && albumEl.classList.contains('open')) closeAlbum(); });
window.addEventListener('hashchange', () => albumEl.classList.contains('open') && closeAlbum());

/* ---------- Cover fallbacks ----------
   The <img> tries Cover Art Archive's pick for the release group first. If that 404s, we work down a list,
   cheapest first: iTunes → Deezer → Wikipedia → other editions on Cover Art Archive → Discogs. */
const norm = t => t.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
  .replace(/\s+-\s+(ep|single)$/, '').replace(/\(.*?\)|\[.*?\]/g, '').replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
const discogsToken = () => { try { return localStorage.getItem('discogsToken') || ''; } catch { return ''; } };
// One small queue per service so a slow one doesn't hold up the others.
const queues = {};
const throttled = (name, fn, gap) => {
  const p = (queues[name] || Promise.resolve()).then(fn);
  queues[name] = p.catch(() => {}).then(() => sleep(gap));
  return p;
};
// Same artist ("The" optional), and the same title — exact first, else one starting with the other
// (catches "Trait (Deluxe Edition)", "… - Remastered" and the like).
// Also accepts shared credits, e.g. a split: "Worsen / Whitewurm", "X & Y", "X vs. Y".
const bare = n => norm(n || '').replace(/^the /, '');
const artistMatch = (credit, artist) => [credit, ...(credit || '').split(/\s*(?:\/|,|&|\+|\bvs\.?|\band\b|\bwith\b)\s*/i)]
  .some(part => part && bare(part) === bare(artist));
function bestMatch(list, artist, title, artistOf, titleOf) {
  const t = norm(title), ok = list.filter(x => artistMatch(artistOf(x), artist));
  return ok.find(x => norm(titleOf(x) || '') === t)
    || ok.find(x => { const u = norm(titleOf(x) || ''); return Math.min(u.length, t.length) >= 4 && (u.startsWith(t) || t.startsWith(u)); });
}

const itunesCache = new Map();
function itunesAlbum(artist, title) {
  const k = artist + '|' + title;
  if (!itunesCache.has(k)) itunesCache.set(k, (async () => {
    const r = await throttled('itunes', () => fetch(`https://itunes.apple.com/search?entity=album&limit=25&term=${encodeURIComponent(artist + ' ' + title)}`), 1500);
    if (!r.ok) throw new Error('itunes ' + r.status);
    return bestMatch((await r.json()).results, artist, title, x => x.artistName, x => x.collectionName) || null;
  })());
  itunesCache.get(k).catch(() => itunesCache.delete(k));
  return itunesCache.get(k);
}
async function fromItunes(artist, title) {
  const hit = await itunesAlbum(artist, title);
  return hit ? hit.artworkUrl100.replace('100x100bb', '600x600bb') : '';
}

// Deezer's API has no CORS headers but supports JSONP.
function jsonp(url) {
  return new Promise((ok, fail) => {
    const cb = 'jp' + Math.random().toString(36).slice(2), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); fail(new Error('timeout')); }, 8000);
    window[cb] = d => { done(); ok(d); };
    s.onerror = () => { done(); fail(new Error('jsonp')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function fromDeezer(artist, title) {
  const d = await throttled('deezer', () => jsonp(`https://api.deezer.com/search/album?q=${encodeURIComponent(`artist:"${artist}" album:"${title}"`)}`), 300);
  if (d.error) throw new Error('deezer');
  const hit = bestMatch(d.data || [], artist, title, x => x.artist?.name, x => x.title);
  return hit?.cover_big || hit?.cover_medium || '';
}

// Album articles carry their cover as a non-free image; pilicense=any includes those.
async function fromWikipedia(artist, title) {
  const page = await guessWikiTitle(artist, title);
  if (!page) return '';
  const pg = Object.values((await getJSON(`${WIKI}action=query&prop=pageimages&pilicense=any&piprop=thumbnail&pithumbsize=500&redirects=1&titles=${encodeURIComponent(page)}`)).query.pages)[0];
  return pg?.thumbnail?.source || '';
}

// Cover Art Archive only answers for the edition MusicBrainz picked; another edition often has a scan.
async function fromOtherEditions(rgId) {
  if (rgId.startsWith('dg-')) return '';
  const { releases = [] } = await mb(`release?release-group=${rgId}&limit=100`, { gen });
  const r = releases.find(x => x['cover-art-archive']?.front);
  return r ? `https://coverartarchive.org/release/${r.id}/front-250` : '';
}

// Discogs: search hides images without a token, but the master/release itself includes them.
const dgImage = m => ((m.images || []).find(i => i.type === 'primary') || m.images?.[0])?.uri || '';
async function fromDiscogs(artist, title, rg) {
  if (rg?.src === 'discogs') return dgImage(await dg(`${rg.dgType === 'master' ? 'masters' : 'releases'}/${rg.dgId}`, { gen }));
  for (const type of ['master', 'release']) {
    const res = await dg(`database/search?type=${type}&per_page=10&artist=${encodeURIComponent(artist)}&release_title=${encodeURIComponent(title)}`, { gen });
    // Search titles look like "Artist - Title".
    const hit = bestMatch(res.results || [], artist, title, x => x.title.split(' - ')[0], x => x.title.split(' - ').slice(1).join(' - '));
    if (!hit) continue;
    if (hit.cover_image && !hit.cover_image.includes('spacer.gif')) return hit.cover_image;
    return dgImage(await dg(`${type}s/${hit.id}`, { gen }));
  }
  // Last try: a plain keyword search, which finds splits and releases credited to several artists.
  const res = await dg(`database/search?per_page=10&q=${encodeURIComponent(artist + ' ' + title)}`, { gen });
  const hit = bestMatch((res.results || []).filter(x => x.type === 'master' || x.type === 'release'), artist, title,
    x => x.title.split(' - ')[0], x => x.title.split(' - ').slice(1).join(' - '));
  if (!hit) return '';
  if (hit.cover_image && !hit.cover_image.includes('spacer.gif')) return hit.cover_image;
  return dgImage(await dg(`${hit.type}s/${hit.id}`, { gen }));
}

async function coverFallback(img, rgId) {
  const card = img.parentElement, title = img.dataset.title, artist = state.artist.name;
  const rg = state.releases.find(r => r.id === rgId);
  img.remove();
  const key = 'cover3:' + rgId;
  let url = null;
  try { url = localStorage.getItem(key); } catch {}
  if (url === null) {
    const sources = [() => fromItunes(artist, title), () => fromDeezer(artist, title), () => fromWikipedia(artist, title),
      () => fromOtherEditions(rgId), () => fromDiscogs(artist, title, rg)];
    if (rg?.src === 'discogs') sources.unshift(sources.pop());   // it's a Discogs release: ask Discogs directly first
    let unsure = false;
    for (const source of sources) {
      if (!card.isConnected) return;   // re-rendered or navigated away: the new card will pick this up
      try { url = await source(); } catch { unsure = true; url = ''; }
      if (url) break;
    }
    // Only remember a miss if every source actually answered.
    if (url || !unsure) try { localStorage.setItem(key, url); } catch {}
  }
  if (!url || !card.isConnected) return;
  const i = new Image(); i.alt = ''; i.src = url; i.onerror = () => i.remove(); card.appendChild(i);
}
function setDiscogsToken() {
  const t = prompt('Paste a Discogs personal access token to speed up Discogs lookups (members and covers for obscure releases).\nGet one free at discogs.com/settings/developers. It is stored only in this browser.\n\nLeave empty to remove it.', discogsToken());
  if (t === null) return;
  try { t.trim() ? localStorage.setItem('discogsToken', t.trim()) : localStorage.removeItem('discogsToken'); } catch {}
  renderReleases();
}

/* ---------- Boot ---------- */
route(location.hash.slice(1));
</script>
</body>
</html>
