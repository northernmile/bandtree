      <a class="herobrowse" href="#browse">or browse by label, city or scene ›</a>
      <div class="lineup"><h2>Try one</h2><div class="names">${picks.map(p =>
        `<a data-n="${esc(p)}">${esc(p)}</a>`).join('&nbsp;<span class="sl">/</span> ')}</div></div>
      ${pathsHTML()}${msListHTML()}
    </div>`;
  document.getElementById('heroSearch').appendChild(searchBox);
  main.querySelectorAll('[data-n]').forEach(el => el.onclick = () => searchAndGo(el.dataset.n));
}

/* ---------- Artist page: column navigator ----------
   Every stop on the trail is a "stage" with three columns: the artist's stats, their members (or bands),
   and whatever the selected row links to. Stages sit side by side on one track that slides left/right. */
const state = { artist: null, rels: [], releases: [], filter: 'Album' };
const stages = new Map();  // artist id -> stage
let mobileCol = 0, pendingMobileCol = null;

function stageFor(id) {
  if (isAlbumId(id)) {
    if (!stages.has(id)) { const st = albumStage(id); st.ready.catch(() => stages.delete(id)); stages.set(id, st); }
    return stages.get(id);
  }
  if (!stages.has(id)) {
    const st = { id, artist: null, kind: null, rels: [], relSource: null, altIds: new Set([id]), links: new Map(), linkP: new Map(),
      place: null, releases: null, discogsId: null, enrich: null };
    st.ready = getArtist(id, { priority: true }).then(a => {
      st.artist = a; st.kind = kindOf(a.type);
      st.rels = st.kind === 'band' ? a.members : a.bands;
      if (a.discogsId) { st.discogsId = a.discogsId; st.altIds.add('discogs:' + a.discogsId); }
      if (a.src === 'mb') resolvePlace(a).then(p => { if (p) { st.place = p; refreshStage(id); } });
      if (a.src === 'discogs') {
        st.profile = a.profile;
        if (a.image) preload(a.image).then(src => { st.image = { src, credit: a.url, by: 'Discogs' }; refreshStage(id); }).catch(() => {});
      }
      // Nobody listed on MusicBrainz: look for the lineup elsewhere.
      if (a.src === 'mb' && !st.rels.length) enrichStage(st);
      // Listed: add anyone Discogs / Wikipedia knows that MusicBrainz doesn't, then fill in missing dates.
      else mergeMembers(st).catch(() => {}).then(() => fillDates(st)).catch(() => {}).finally(() => { st.datesChecked = true; maybeBandCredits(st); });
      loadNames(st).catch(() => {});
      loadBlurb(st).catch(() => {});
      if (st.kind === 'person') fillPersonGaps(st).catch(() => {});
      return st;
    });
    // Only needs the ID, so fetch the photo alongside the MusicBrainz lookup.
    if (!id.includes(':')) artistImage(id).then(img => { if (img) { st.image = img; st.ready.then(() => refreshStage(id)); } }).catch(() => {});
    st.ready.catch(() => stages.delete(id));
    stages.set(id, st);
  }
  return stages.get(id);
}
// The other side of a row: a member's other bands, or a band's other members.
function loadLinks(st, rel, opts = {}) {
  if (!st.linkP.has(rel.id)) {
    const p = getArtist(rel.id, opts).then(a => {
      // "Clyde Battin" (MusicBrainz) and "Skip Battin" (Discogs) are one person when MusicBrainz links that Discogs entry.
      const dup = a.discogsId && st.rels.find(r => r !== rel && r.id === 'discogs:' + a.discogsId);
      if (dup) { st.rels = st.rels.filter(r => r !== dup); if (trail[cur]?.id === st.id) { state.rels = st.rels; renderTimeline(); } scheduleRefresh(st.id); }
      const list = (st.kind !== 'person' ? a.bands : a.members).filter(x => !st.altIds.has(x.id));
      st.links.set(rel.id, list);
      if (st.kind !== 'person') fetchBandYears(list).then(got => got && scheduleRefresh(st.id)).catch(() => {});
      return list;
    });
    p.catch(() => st.linkP.delete(rel.id));
    st.linkP.set(rel.id, p);
  }
  return st.linkP.get(rel.id);
}

async function load(id) {
  const myGen = ++gen;
  if (document.getElementById('tree')?.classList.contains('open')) closeTree();
  leaveHome();
  hideNavTip();
  if (twinPickFor && twinPickFor !== id) pickDone?.(undefined);   // that question was about the band you just left
  trailVisit(id);
  if (!document.getElementById('track')) shell();
  mobileCol = pendingMobileCol ?? 0; pendingMobileCol = null;
  const st = stageFor(id);
  renderNav();
  const lb = document.getElementById('loadbar'); if (lb) lb.pct = 0;   // new page: bar starts over
  setStatus();
  // Every other stop on the trail (e.g. after a refresh) loads too, so sliding back is instant.
  trail.forEach(t => {
    if (t.id === id) return;
    const s = stageFor(t.id);
    s.ready.then(() => {
      refreshStage(t.id);
      const r = t.sel && s.rels.find(r => r.id === t.sel.id);
      if (r) loadLinks(s, r).then(() => refreshStage(t.id)).catch(() => {});
    }).catch(() => {});
  });
  try { await st.ready; } catch (e) {
    const el = document.querySelector(`.stage[data-i="${cur}"] .col.info`);
    if (el) el.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    return;
  }
  if (myGen !== gen) return;
  trailName(id, st.artist.name, st.artist.type);
  refreshStage(id);
  if (scrollY > 200) window.scrollTo({ top: 0, behavior: 'smooth' });
  if (st.kind === 'album') showAlbumLower(st); else showLower(st, myGen);
  const sel = st.kind !== 'person' && trail[cur].sel && st.rels.find(r => r.id === trail[cur].sel.id);
  if (sel) loadLinks(st, sel, { priority: true }).then(() => refreshStage(id)).catch(() => {});
  if (st.enrich === 'deferred') enrichStage(st);
  prefetchLinks(st, myGen);
}
// Background: every row's links, for the counts and the "+2 from Ministry" tags.
function prefetchLinks(st, myGen) {
  for (const r of st.rels) loadLinks(st, r, { gen: myGen }).then(() => scheduleRefresh(st.id)).catch(() => {});
}

/* MusicBrainz has no lineup for this artist: try Wikidata (exact match via the MusicBrainz ID), then Discogs
   (exact via MusicBrainz's own Discogs link, else by name — asking which one if there's more than one). */
async function enrichStage(st) {
  st.enrich = 'running'; refreshStage(st.id);
  const band = st.kind === 'band';
  let rels = [], source = null;
  try { rels = await wikidataRels(st.id, band); if (rels.length) source = 'Wikidata'; } catch {}
  if (!rels.length) {
    let did = st.discogsId;
    if (!did) {
      did = await findDiscogsTwin(st).catch(() => null);
      if (did === undefined) { st.enrich = 'deferred'; refreshStage(st.id); return; }   // ambiguous and not on screen: ask later
      st.matchedByName = !!did;
    }
    if (did) {
      st.discogsId = did; st.altIds.add('discogs:' + did);
      try {
        const d = await discogsArtist(did, { priority: true });
        rels = band ? d.members : d.bands;
        if (rels.length) source = 'Discogs';
        if (!st.profile && d.profile) st.profile = d.profile;
        if (!st.image && d.image) preload(d.image).then(src => { st.image = { src, credit: d.url, by: 'Discogs' }; refreshStage(st.id); }).catch(() => {});
      } catch {}
      // MusicBrainz had no releases either: the Discogs discography can stand in.
      if (st.releases && !st.releases.length) { st.releases = null; if (trail[cur]?.id === st.id) showLower(st, gen); }
    }
  }
  st.enrich = 'done';
  if (rels.length) { st.rels = rels; st.relSource = source; fillDates(st).catch(() => {}).finally(() => { st.datesChecked = true; maybeBandCredits(st); }); }
  refreshStage(st.id);
  if (rels.length && trail[cur]?.id === st.id) {
    state.rels = st.rels; renderTimeline();
    document.getElementById('tlCount').textContent = st.rels.length;
    prefetchLinks(st, gen);
  }
}
// Undo a by-name Discogs match and ask again.
function rematchDiscogs(st) {
  try { localStorage.removeItem('dgtwin:' + st.id); } catch {}
  st.altIds.delete('discogs:' + st.discogsId);
  Object.assign(st, { rels: [], relSource: null, discogsId: null, matchedByName: false, profile: null });
  if (st.image?.by === 'Discogs') st.image = null;
  st.links.clear(); st.linkP.clear();
  enrichStage(st);
}
let twinPickFor = null;   // the band a "which one on Discogs?" question is about
async function findDiscogsTwin(st) {
  const key = 'dgtwin:' + st.id;
  let saved = null;
  try { saved = localStorage.getItem(key); } catch {}
  if (saved !== null) return saved || null;
  const name = st.artist.name, band = st.kind === 'band';
  const found = (await dgSearch(name)).filter(r => norm(cleanDgName(r.title)) === norm(name));
  let pick;
  if (!found.length) pick = null;
  else if (found.length === 1) pick = String(found[0].id);
  else if (trail[cur]?.id !== st.id) return undefined;
  else {
    twinPickFor = st.id;
    const v = await choose({ title: `Which ${name} is this?`,
      sub: `We don't have ${band ? 'members' : 'bands'} for ${name} (${mbDesc(st.artist) || 'no details'}) yet. There are ${found.length} other artists with this name — pick the same one to fill in the gaps.`,
      options: found.slice(0, 8).map(dgOption), none: 'None of these' });
    twinPickFor = null;
    if (v === undefined) return undefined;   // dismissed (or you moved on): don't remember, ask again next visit
    pick = v ? v.replace('discogs:', '') : null;
  }
  try { localStorage.setItem(key, pick || ''); } catch {}
  return pick;
}

// Wikidata: a band's "has part(s)" (P527) or a musician's "member of" (P463), with start/end qualifiers.
const wdCache = new Map();
function wikidataEntity(mbid) {
  if (!wdCache.has(mbid)) wdCache.set(mbid, (async () => {
    const s = await getJSON(`${WD}action=query&list=search&srlimit=1&srsearch=haswbstatement:P434=${mbid}`);
    const qid = s.query.search[0]?.title;
    if (!qid) return null;
    return (await getJSON(`${WD}action=wbgetentities&ids=${qid}&props=claims|sitelinks&sitefilter=enwiki`)).entities[qid];
  })().catch(() => null));
  return wdCache.get(mbid);
}
const wdTime = snak => {
  const v = snak?.datavalue?.value;
  if (!v?.time) return undefined;
  const [y, m, d] = v.time.slice(1, 11).split('-');
  return v.precision >= 11 ? `${y}-${m}-${d}` : v.precision === 10 ? `${y}-${m}` : y;
};
async function wikidataRels(mbid, band) {
  const e = await wikidataEntity(mbid);
  const items = (e?.claims?.[band ? 'P527' : 'P463'] || []).map(c => ({ qid: c.mainsnak?.datavalue?.value?.id,
    begin: wdTime(c.qualifiers?.P580?.[0]), end: wdTime(c.qualifiers?.P582?.[0]) })).filter(x => x.qid);
  if (!items.length) return [];
  const ids = [...new Set(items.map(i => i.qid))].slice(0, 50);
  const ents = (await getJSON(`${WD}action=wbgetentities&ids=${ids.join('|')}&props=labels|claims&languages=en`)).entities;
  const byId = new Map();
  for (const it of items) {
    const m = ents[it.qid];
    if (!m) continue;
    const val = p => m.claims?.[p]?.[0]?.mainsnak?.datavalue?.value;
    const human = (m.claims?.P31 || []).some(c => c.mainsnak?.datavalue?.value?.id === 'Q5');
    // A band's parts must be people; a person's "member of" must be a music act (has a MusicBrainz or Discogs ID).
    if (band ? !human : !(val('P434') || val('P1953'))) continue;
    const id = val('P434') || (val('P1953') ? 'discogs:' + val('P1953') : 'wd:' + it.qid);
    const r = byId.get(id) || { id, name: m.labels?.en?.value || it.qid, type: band ? 'Person' : 'Group', disambiguation: '', periods: [], attrs: new Set() };
    r.periods.push({ begin: it.begin, end: it.end, ended: !!it.end, attrs: [] });
    byId.set(id, r);
  }
  return finalizeRels([...byId.values()]);
}

/* ---------- Filling in missing lineup dates ----------
   MusicBrainz often lists members with no dates. For anyone undated we roll over to the next source:
   1. Wikidata: the band's "has part" (P527), then each member's own "member of" (P463) — often dated when the band's isn't.
   2. The Members section of the band's Wikipedia article: "David Yow – vocals (1987–1999, 2008–2010, 2017–present)".
   Wikipedia can also add members nobody else lists. Dates that already exist always win. */
const isDated = r => r.periods.some(p => p.begin || p.end);
// Same person under different spellings: "David Wm. Sims" = "David Sims", "Jim Kimball" = "James Kimball", "J. Kimball".
const NICK = Object.fromEntries(['james jim jimmy jamie', 'robert rob bob bobby robbie', 'william will bill billy', 'michael mike mick mikey',
  'richard rick dick rich ricky', 'thomas tom tommy', 'joseph joe joey', 'stephen steven steve stevie', 'christopher chris',
  'daniel dan danny', 'david dave davey', 'matthew matt', 'anthony tony', 'edward ed eddie ted', 'nicholas nick nicky',
  'peter pete', 'samuel sam sammy', 'timothy tim timmy', 'andrew andy drew', 'kenneth ken kenny', 'gregory greg',
  'jeffrey jeff geoffrey', 'ronald ron ronnie', 'donald don donnie', 'lawrence larry', 'gerald jerry', 'charles charlie chuck',
  'benjamin ben benny', 'alexander alex sandy', 'patrick pat', 'jonathan jon', 'john jack johnny', 'frederick fred freddie',
  'raymond ray', 'douglas doug', 'gary garry', 'philip phil', 'leonard len lenny', 'stanley stan', 'albert al', 'alan al allen']
  .flatMap(g => { const w = g.split(' '); return w.map(n => [n, w[0]]); }));
// Spellings one letter apart ("Philips" / "Phillips").
function oneEdit(a, b) {
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return d + (a.length - i) + (b.length - j) <= 1;
}
function sameName(a, b) {
  const x = norm(a).split(' '), y = norm(b).split(' ');
  if (!x[0] || !y[0]) return false;
  if (x.join(' ') === y.join(' ')) return true;
  if (x.length < 2 || y.length < 2) return false;
  const f = x[0], g = y[0], lx = x.at(-1), ly = y.at(-1);
  if (lx !== ly) return f === g && lx.length >= 5 && ly.length >= 5 && ((lx.startsWith(ly) || ly.startsWith(lx)) && Math.abs(lx.length - ly.length) <= 2 || oneEdit(lx, ly));
  return f === g || (NICK[f] && NICK[f] === NICK[g]) || (f.length === 1 && g[0] === f) || (g.length === 1 && f[0] === g);
}
async function wikidataMemberDates(bandQid, mbids) {
  const out = new Map();
  if (!bandQid || !mbids.length) return out;
  const q = `SELECT ?mbid ?s ?e WHERE { VALUES ?mbid { ${mbids.map(m => `"${m}"`).join(' ')} }
    ?p wdt:P434 ?mbid; p:P463 ?st. ?st ps:P463 wd:${bandQid}. OPTIONAL { ?st pq:P580 ?s } OPTIONAL { ?st pq:P582 ?e } }`;
  const d = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q));
  for (const b of d.results.bindings) {
    if (!b.s && !b.e) continue;
    const list = out.get(b.mbid.value) || [];
    list.push({ begin: b.s?.value.slice(0, 4), end: b.e?.value.slice(0, 4), ended: !!b.e, attrs: [] });
    out.set(b.mbid.value, list);
  }
  return out;
}
const MEMBER_SECTION = /^(current |former |band |the )?(members|personnel|line-?ups?)$/i;
async function wikipediaMembers(titles) {
  for (const title of titles) {
    const secs = (await getJSON(`${WIKI}action=parse&prop=sections&redirects=1&page=${encodeURIComponent(title)}`).catch(() => null))?.parse?.sections;
    const sec = secs?.find(s => MEMBER_SECTION.test(s.line.replace(/<[^>]+>/g, '').trim()));
    if (!sec) continue;
    const html = (await getJSON(`${WIKI}action=parse&prop=text&redirects=1&section=${sec.index}&page=${encodeURIComponent(title)}`)).parse.text['*'];
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('sup, .mw-editsection, style, table.navbox').forEach(n => n.remove());
    const out = [];
    for (const li of doc.querySelectorAll('li')) {
      if (li.querySelector('li')) continue;           // nested lists: only the leaves are people
      const m = parseWpMember(li);
      if (m && !out.some(o => sameName(o.name, m.name))) out.push(m);
      else if (m) out.find(o => sameName(o.name, m.name)).periods.push(...m.periods);
    }
    if (out.length) return out;
  }
  return [];
}
function parseWpMember(li) {
  const text = li.textContent.replace(/\s+/g, ' ').trim();
  const name = text.split(/\s[–—-]\s|\s?\(|:|,/)[0].trim();
  if (!name || name.length > 50 || /\d/.test(name)) return null;
  const periods = [];
  for (const grp of text.match(/\([^()]*\d{4}[^()]*\)/g) || []) {
    for (const part of grp.slice(1, -1).split(/[;,]/)) {
      if (/died|born|death|\bd\.|\bb\.|†/i.test(part)) continue;
      const m = part.match(/(\d{4})\s*(?:[–—-]\s*(\d{4}|\d{2}\b|present|now|current))?/i);
      if (!m) continue;
      const open = /present|now|current/i.test(m[2] || '');
      const end = open ? undefined : m[2] ? (m[2].length === 2 ? m[1].slice(0, 2) + m[2] : m[2]) : m[1];
      periods.push({ begin: m[1], end, ended: !open, attrs: [] });
    }
  }
  const roles = ((text.match(/\s[–—-]\s([^(]+)/) || [])[1] || '').split(/,|\/|\band\b/).map(s => s.trim().toLowerCase())
    .filter(s => s && s.length < 40);
  const link = [...li.querySelectorAll('a')].find(a => /^\/wiki\/[^:]+$/.test(a.getAttribute('href') || '') && name.includes(a.textContent.trim()));
  const title = link ? decodeURIComponent(link.getAttribute('href').slice(6)).replace(/_/g, ' ') : null;
  return { name, title, roles, periods };
}
// Wikipedia article titles -> MusicBrainz IDs (or wd:Q… when Wikidata has no MusicBrainz ID).
async function idsForTitles(titles) {
  const out = new Map();
  if (!titles.length) return out;
  const d = await getJSON(`${WD}action=wbgetentities&sites=enwiki&props=claims|sitelinks&sitefilter=enwiki&titles=${encodeURIComponent(titles.slice(0, 50).join('|'))}`);
  for (const [qid, e] of Object.entries(d.entities || {})) {
    const t = e.sitelinks?.enwiki?.title;
    if (t) out.set(norm(t), e.claims?.P434?.[0]?.mainsnak?.datavalue?.value || 'wd:' + qid);
  }
  return out;
}
async function fillDates(st) {
  if (st.kind !== 'band' || !st.rels.length || st.rels.every(isDated)) return;
  const mbid = st.artist.src === 'mb' ? st.id : null;
  const ent = mbid ? await wikidataEntity(mbid) : null;
  const titles = ent?.sitelinks?.enwiki ? [ent.sitelinks.enwiki.title] : [st.artist.name + ' (band)', st.artist.name];
  const need = st.rels.filter(r => !isDated(r));
  const [bandSide, personSide, wp] = await Promise.all([
    mbid ? wikidataRels(mbid, true).catch(() => []) : [],
    wikidataMemberDates(ent?.id, need.map(r => r.id).filter(id => !id.includes(':'))).catch(() => new Map()),
    wikipediaMembers(titles).catch(() => [])]);
  // Only trust the Wikipedia list if it's the same band: people we already have should be on it.
  const wpOk = wp.filter(w => st.rels.some(r => sameName(r.name, w.name))).length >= Math.min(2, st.rels.length);
  const from = new Set();
  for (const r of need) {
    const periods = bandSide.find(x => x.id === r.id && isDated(x))?.periods || personSide.get(r.id);
    if (periods?.length) { r.periods = periods.map(p => ({ ...p, attrs: p.attrs.length ? p.attrs : [...r.attrs] })); from.add('Wikidata'); continue; }
    const w = wpOk && wp.find(x => x.periods.length && sameName(r.name, x.name));
    if (!w) continue;
    if (!r.attrs.size) w.roles.forEach(a => r.attrs.add(a));
    r.periods = w.periods.map(p => ({ ...p, attrs: [...r.attrs] }));
    from.add('Wikipedia');
  }
  const extra = wpOk ? wp.filter(w => w.periods.length && !st.rels.some(r => sameName(r.name, w.name))) : [];
  if (extra.length) {
    const ids = await idsForTitles(extra.map(w => w.title).filter(Boolean)).catch(() => new Map());
    for (const w of extra) {
      const id = (w.title && ids.get(norm(w.title))) || 'wd:' + norm(w.name).replace(/ /g, '-');
      if (st.rels.some(r => r.id === id)) continue;
      st.rels.push({ id, name: w.name, type: 'Person', disambiguation: '', periods: w.periods.map(p => ({ ...p, attrs: w.roles })), attrs: new Set(w.roles) });
    }
    from.add('Wikipedia');
  }
  if (!from.size) return;
  st.rels = finalizeRels(st.rels); st.dateSource = [...from].join(' + ');
  refreshStage(st.id);
  if (trail[cur]?.id === st.id) {
    state.rels = st.rels; renderTimeline();
    document.getElementById('tlCount').textContent = st.rels.length;
  }
}

/* ---------- Album pages ----------
   An album is a stop on the trail like a band: info (cover, facts, notes) · who played on it · the selected
   person's other bands. IDs are "album:<release-group MBID>" or "album:dg-master-<id>" / "album:dg-release-<id>".
   Credits come from the MusicBrainz release (release + per-track credits); if that has no performers, the
   Discogs credits; failing both, the band's lineup when the record came out. */
const albumSeeds = new Map();   // album id -> { rg, band, cover } from the discography card that was clicked
const isAlbumId = id => id.startsWith('album:');
const PRODUCTION = /produc|engineer|recorded|recording|mix|master|^audio|^sound/i;
const SKIP_CREDIT = /written|lyrics|edited|editor|insert|inlay|poster|compos|songwriter|design|photo|artwork|art direction|cover|illustrat|paint|drawing|graphic|typograph|lettering|logo|sleeve|liner|layout|lacquer|manage|a&r|copyright|phonographic|booklet|booking|legal|translat|coordinat|executive|publish|licens|marketing|thanks/i;

const MB_PROD = ['producer', 'engineer', 'recording', 'mix', 'mastering', 'audio', 'sound'];

function openAlbumStage(rg) {
  const here = stages.get(trail[cur]?.id);
  if (!rg || !here?.artist) return;
  const band = rg.bandId ? { id: rg.bandId, name: rg.band } : here.kind === 'album' ? here.album.band : { id: here.id, name: here.artist.name };

/* ---------- Line-ups (when there are no dates) ----------
   If most of a band's members have no dates anywhere, work out line-ups from who played on each record instead:
   every distinct set of band members across the albums and EPs is a line-up (A, B, C… in order of first release). */
const mostlyUndated = st => st.rels.filter(r => !isDated(r)).length >= Math.max(1, st.rels.length / 2);
/* ---------- Band-wide credits ----------
   Every band's albums and EPs are read once in the background (up to 15, cached). That gives one view of who played

const creditCache = new Map();   // release-group id -> promise of that record's credits
function recordCredits(rg, opts = {}, bandName = '') {
  if (!creditCache.has(rg.id)) creditCache.set(rg.id, (async () => {
    // Wikipedia's Personnel section when the record has an article (no rate limit, hand-checked).
    const t = await guessWikiTitle(bandName, rg.title).catch(() => null);
    const wp = t ? await wikipediaPersonnel(t, bandName).catch(() => []) : [];
    if (wp.some(p => p.play.length)) return wp;
    const tmp = { rg, facts: {}, listen: {}, info: null, tracks: null };
    let list = rg.src === 'discogs' ? await albumDiscogsCredits(tmp, rg.dgType, rg.dgId, opts) : await albumMBCredits(tmp, opts);
    if (list.some(p => p.play.length) || rg.src === 'discogs') return list;
    // No players on MusicBrainz: its release-group page usually links the Discogs master, which often has them.
    if (!tmp.dgLink) {
      const info = await mb(`release-group/${rg.id}?inc=url-rels`, opts).catch(() => null);
      const d = (info?.relations || []).map(r => r.url?.resource?.match(/discogs\.com\/(master|release)\/(\d+)/)).find(Boolean);
      if (d) tmp.dgLink = [d[1], d[2]];
    }
    if (tmp.dgLink) {
      const dgList = await albumDiscogsCredits(tmp, ...tmp.dgLink, opts).catch(() => []);
      if (dgList.some(p => p.play.length)) list = [...dgList, ...list.filter(p => !dgList.some(q => sameName(q.name, p.name)))];
    }

}
const topRoles = (counts, n) => [...counts].sort((a, b) => b[1] - a[1]).map(x => x[0]).filter(x => x !== 'performer').slice(0, n);
const creditKey = (st, p) => {
  let m = st.rels.find(r => r.id === p.id || sameName(r.name, p.name));
  // A first name only ("Dave"): that member, if exactly one member goes by it.
  const one = norm(p.name).split(' ');
  if (!m && one.length === 1) {
    const hits = st.rels.filter(r => { const f = norm(r.name).split(' ')[0]; return f === one[0] || (NICK[f] && NICK[f] === NICK[one[0]]); });
    if (hits.length === 1) m = hits[0];

};
function maybeBandCredits(st) {   // (name kept: called once releases and dates are both in)

  loadBandCredits(st).catch(() => { if (st.bandCredits) st.bandCredits.state = 'done'; });
}
async function loadBandCredits(st) {
  let records = st.releases.filter(r => ['Album', 'EP'].includes(relType(r)));
  if (!records.length) records = st.releases;   // singles-only bands: their singles are the records
  records = records.slice(0, 15);
  const bc = st.bandCredits = { state: 'running', done: 0, total: records.length, credited: 0, perRecord: [], people: new Map() };
  for (const rg of records) {
    const list = (await recordCredits(rg, {}, st.artist.name).catch(() => []))
      .filter(p => p.id !== st.id && !sameName(p.name, st.artist.name));   // "produced by the band" isn't a person
    bc.perRecord.push({ rg, list, players: [], credited: list.some(p => p.play.length) });
    bc.done++;

// Who's who across the records, matched against the band's current member list (re-run if that list grows).
function tallyBandCredits(st) {
  const bc = st.bandCredits;
  bc.people = new Map(); bc.credited = 0;
  for (const x of bc.perRecord) {
    const players = new Set();
    for (const p of x.list) {
      const key = creditKey(st, p), m = st.rels.find(r => r.id === key);
      const e = bc.people.get(key) || { key, id: m ? m.id : p.id, name: m ? m.name : p.name, member: !!m, records: new Set(), play: new Map(), prod: new Map() };
      e.records.add(x.rg.id);
      p.play.forEach(r => e.play.set(r, (e.play.get(r) || 0) + 1));
      p.prod.forEach(r => e.prod.set(r, (e.prod.get(r) || 0) + 1));
      bc.people.set(key, e);
      if (m && p.play.length) players.add(m.id);

}
function finishBandCredits(st) {
  const bc = st.bandCredits;

  // People who play on at least half of the band's own records are in the band, even if no member list names them
  // (Raymond: Discogs lists 1 member, its single credits 3). Wikipedia's "additional musicians" never count.
  const counts = new Map();
  for (const x of bc.perRecord) for (const p of x.list) {
    if (!p.play.length || p.group === 'extra') continue;
    const key = creditKey(st, p);
    if (st.rels.some(r => r.id === key)) continue;
    const c = counts.get(key) || { p, n: 0 }; c.n++; counts.set(key, c);
  }
  const need = Math.max(1, Math.ceil(bc.credited / 2));
  const joined = [...counts.values()].filter(c => c.n >= need && !c.p.id.startsWith('n:') && /\s/.test(c.p.name.trim()));   // a first name alone ("Tomas") isn't enough to add someone
  if (joined.length) {
    st.rels = finalizeRels([...st.rels, ...joined.map(({ p }) => ({ id: p.id, name: p.name, type: 'Person', disambiguation: '',
      periods: [], attrs: new Set(p.play), note: '' }))]);

    tallyBandCredits(st);
  }
  // Members with no instrument listed get their usual role across the records.
  for (const r of st.rels) { const e = bc.people.get(r.id); if (e && !r.instruments.length) r.instruments = topRoles(e.play, 2); }
  // Members with no dates anywhere: take their years from the records they played on (first to last).
  let fromRecords = 0;
  for (const r of st.rels) {
    if (r.periods.some(p => (p.begin || p.end) && !p.fromRecords)) continue;
    const ys = bc.perRecord.filter(x => x.players.includes(r.id)).map(x => year(x.rg['first-release-date'])).filter(Boolean).sort();
    if (!ys.length) continue;
    r.instruments.forEach(x => r.attrs.add(x));
    // One stint per run of records; a gap of more than 3 years starts a new one (a split, then a reunion).
    const yrs = [...new Set(ys.map(Number))].sort((a, b) => a - b), stints = [];
    for (const y of yrs) { const last = stints.at(-1); if (last && y - last[1] <= 3) last[1] = y; else stints.push([y, y]); }

    // from the start, someone on its last was there to the end (within 3 years either way).
    const ls = st.artist?.['life-span'] || {}, bb = +year(ls.begin) || 0, be = ls.ended ? +year(ls.end) || 0 : 0;
    // The band's records while it was together (a posthumous EP or compilation doesn't count as "the last one").
    const all = bc.perRecord.filter(x => x.players.length).map(x => +year(x.rg['first-release-date'])).filter(y => y && (!be || y <= be)).sort((a, b) => a - b);
    if (bb && stints[0][0] === all[0] && bb < stints[0][0] && stints[0][0] - bb <= 3) stints[0][0] = bb;
    const lastS = stints.at(-1);
    if (be && lastS[1] === all.at(-1) && be > lastS[1] && be - lastS[1] <= 3) lastS[1] = be;
    r.periods = stints.map(([b, e]) => ({ begin: String(b), end: String(e), ended: true, attrs: [...r.attrs], fromRecords: true }));
    fromRecords++;
  }
  if (fromRecords) {
    st.rels = finalizeRels(st.rels);
    if (!/album credits/.test(st.dateSource || '')) st.dateSource = [st.dateSource, 'album credits'].filter(Boolean).join(' + ');
  }
  refreshStage(st.id);
  if (trail[cur]?.id === st.id && state.artist === st.artist) { state.rels = st.rels; renderTimeline(); }
  // Album pages for this band that are already open: same names, roles and order as everywhere else.
  for (const s of stages.values()) if (s.kind === 'album' && s.album.band?.id === st.id && s.credits === 'done') {
    if (!s.rels.some(p => p.play.length)) fillFromNearest(s, st);
    s.rels = sortCredits(s, s.rels); refreshStage(s.id);

}
// A record with no credits: borrow the line-up from the nearest credited record (by release date).
function fillFromNearest(s, bst) {
  const y = toYear(s.rg['first-release-date'] || '');

    .sort((a, b) => Math.abs(toYear(a.rg['first-release-date'] || '') - y) - Math.abs(toYear(b.rg['first-release-date'] || '') - y))[0];
  if (!near || !y) return false;
  const people = near.players.map(id => bst.rels.find(r => r.id === id)).filter(Boolean).map(r => ({ id: r.id, name: r.name, type: 'Person',
    periods: [], attrs: new Set(), play: r.instruments.length ? r.instruments.slice(0, 2) : ['performer'], prod: [], tracks: new Set(), instruments: [], span: '', first: '9999' }));
  s.rels = [...people, ...s.rels.filter(p => !people.some(q => q.id === p.id))];
  s.relSource = `line-up on ${near.rg.title} (${year(near.rg['first-release-date'])})`;

}
// Band page: people on 2+ records who aren't members (producers, session players).
function regularsRows(st) {

  const list = [...bc.people.values()].filter(e => !e.member && e.records.size >= 2 && !e.id.startsWith('wd:') && /\s/.test(e.name.trim()))
    .sort((a, b) => b.records.size - a.records.size || a.name.localeCompare(b.name)).slice(0, 12);
  if (!list.length) return '';
  return '<div class="subhead">Regular collaborators</div>' + list.map(e => `<div class="row" data-go="${esc(e.id)}"><div class="txt">
    <div class="nm">${esc(e.name)}</div><div class="meta">${esc([...topRoles(e.play, 1), ...topRoles(e.prod, 1)].join(', '))} · on ${e.records.size} records</div></div></div>`).join('');

/* ---------- Other names ----------
   One person, many names: Richard D. James records as Aphex Twin, AFX, Polygon Window… MusicBrainz links them with
   "is person" (a stage name points at the real person, who points at all of their names); Discogs has "aliases" and
   "realname". Both are merged: MusicBrainz first, then any extra names Discogs knows. */
async function loadNames(st) {
  const a = st.artist;
  let names = [], real = null;
  if (a.src === 'mb') {
    const isPerson = list => (list || []).filter(r => r.type === 'is person' && r.artist);
    real = isPerson(a.relations).find(r => r.direction === 'backward')?.artist || null;
    let pool = isPerson(a.relations).filter(r => r.direction === 'forward').map(r => r.artist);
    if (real) {
      const p = await getArtist(real.id).catch(() => null);
      pool = isPerson(p?.relations).filter(r => r.direction === 'forward').map(r => r.artist);
    }
    names = pool.filter(x => x.id !== a.id).map(x => ({ id: x.id, name: x.name }));
    if (real) real = { id: real.id, name: real.name };
  }
  if (st.discogsId && (st.kind === 'person' || names.length || real)) {
    const d = await discogsArtist(st.discogsId).catch(() => null);
    for (const x of d?.aliases || []) {
      const n = cleanDgName(x.name);
      if (!sameName(n, a.name) && !(real && sameName(n, real.name)) && !names.some(y => sameName(y.name, n))) names.push({ id: 'discogs:' + x.id, name: n });

  if (!names.length && !real) return;

}

/* ---------- Merging member lists ----------
   MusicBrainz is often incomplete (Swell: 2 members there, 12 on Discogs). So for any MusicBrainz band or musician
   we also add whoever Discogs lists (the exact artist MusicBrainz links to, never a name guess) and, for bands,
   the members in the infobox of the band's own Wikipedia article. People are matched by name; MusicBrainz entries
   win, and added people keep their Discogs "former" flag. */
async function wikipediaInfoboxMembers(title) {
  const html = (await getJSON(`${WIKI}action=parse&prop=text&redirects=1&section=0&page=${encodeURIComponent(title)}`)).parse.text['*'];
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('sup, style').forEach(n => n.remove());
  const out = [];
  for (const tr of doc.querySelectorAll('table.infobox tr')) {
    const th = (tr.querySelector('th')?.textContent || '').trim().toLowerCase();
    if (!/^(past |former |current )?members$/.test(th)) continue;
    const td = tr.querySelector('td');
    if (!td) continue;
    const items = td.querySelectorAll('li').length ? [...td.querySelectorAll('li')]
      : td.innerHTML.split(/<br\s*\/?>/i).map(h => { const d = doc.createElement('div'); d.innerHTML = h; return d; });
    for (const it of items) {
      const name = it.textContent.replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();   // "David Freel (deceased)"
      if (!name || name.length > 50 || /\d/.test(name)) continue;
      const a = [...it.querySelectorAll('a')].find(a => /^\/wiki\/[^:]+$/.test(a.getAttribute('href') || ''));
      out.push({ name, title: a ? decodeURIComponent(a.getAttribute('href').slice(6)).replace(/_/g, ' ') : null, former: /past|former/.test(th) });
    }
  }
  return out;
}
async function mergeMembers(st) {
  if (st.artist.src !== 'mb') return;
  const band = st.kind === 'band', added = [], from = new Set();
  const have = r => st.rels.some(x => x.id === r.id || sameName(x.name, r.name)) || added.some(x => x.id === r.id || sameName(x.name, r.name));
  const [d, wp] = await Promise.all([
    st.discogsId ? discogsArtist(st.discogsId).catch(() => null) : null,
    band ? wikidataEntity(st.id).then(e => e?.sitelinks?.enwiki ? wikipediaInfoboxMembers(e.sitelinks.enwiki.title) : []).catch(() => []) : []]);
  for (const r of (band ? d?.members : d?.bands) || []) {
    if (have(r)) continue;
    added.push({ ...r, periods: [...r.periods], attrs: new Set(r.attrs) }); from.add('Discogs');
  }
  const fresh = wp.filter(w => !have(w));
  if (fresh.length) {
    const ids = await idsForTitles(fresh.map(w => w.title).filter(Boolean)).catch(() => new Map());
    for (const w of fresh) {
      const id = (w.title && ids.get(norm(w.title))) || 'wd:' + norm(w.name).replace(/ /g, '-');
      if (have({ id, name: w.name })) continue;
      added.push({ id, name: w.name, type: 'Person', disambiguation: '', periods: [], attrs: new Set(), note: w.former ? 'former' : '' });
      from.add('Wikipedia');
    }

  if (st.discogsId && !d && !st.mergeRetried) { st.mergeRetried = true; setTimeout(() => mergeMembers(st).catch(() => {}), 20000); }
  if (!added.length) return;
  st.rels = finalizeRels([...st.rels, ...added]);
  st.relSource = ['MusicBrainz', ...from].join(' + ');
  if (st.bandCredits?.state === 'done') finishBandCredits(st);   // late arrivals: find them on the records too
  refreshStage(st.id);
  if (trail[cur]?.id === st.id) {
    state.rels = st.rels; renderTimeline();
    document.getElementById('tlCount').textContent = st.rels.length;
    prefetchLinks(st, gen);
  }
}

// Band lists read like a career: oldest first, years beside the name. When a person's stint has no dates, the band's

const bandYears = new Map();   // MusicBrainz band id -> { first, txt }

    if (r.periods.some(p => p.begin || p.end)) continue;

      const a = await getArtist(r.id).catch(() => null); const ls = a?.['life-span'] || {};

async function fetchBandYears(list) {

  const plays = id => bc ? bc.perRecord.filter(x => x.players.includes(id)).length : 0;

}

// Line the third column up with the selected row, then draw the bracket connectors from the sketch.
function layoutStage(i) {
  const el = document.getElementById('track')?.children[i];
  if (!el) return;
  const sub = el.querySelector('.col.sub .rows'), selRow = el.querySelector('.col.list .row.sel');
  const listRows = el.querySelector('.col.list .rows');
  if (sub && selRow && !document.getElementById('nav').classList.contains('mobile')) {
    sub.style.paddingTop = '0px';
    const room = listRows.offsetTop + listRows.offsetHeight - (sub.offsetTop + sub.offsetHeight);
    sub.style.paddingTop = Math.max(0, Math.min(selRow.offsetTop - sub.offsetTop, room)) + 'px';
  }
  el.querySelector('svg.links')?.remove();
  const S = el.getBoundingClientRect();
  const box = r => ({ l: r.left - S.left, r: r.right - S.left, y: (r.top + r.bottom) / 2 - S.top });
  const bracket = (x0, y0, rows) => {
    if (!rows.length) return '';

    return `M${x0},${y0}H${bx}M${bx},${Math.min(y0, ys[0])}V${Math.max(y0, ys.at(-1))}` + ys.map(y => `M${bx},${y}h14`).join('');
  };
  let d = '', hot = '';
  const title = el.querySelector('.info .title');
  if (title) {
    const rects = title.getClientRects(), t = box(rects[rects.length - 1]);

  if (selRow) hot = bracket(box(selRow.getBoundingClientRect()).r, box(selRow.getBoundingClientRect()).y, [...el.querySelectorAll('.col.sub .row')]);
  el.insertAdjacentHTML('afterbegin', `<svg class="links" width="${S.width}" height="${S.height}"><path class="ln" d="${d}"/><path class="hot" d="${hot}"/></svg>`);
}

/* Photo: Wikidata links MusicBrainz IDs (P434) to a Commons image (P18). Photos only — logos are usually SVG/PNG. */
async function artistImage(mbid) {
  const e = await wikidataEntity(mbid);
  if (!e) return null;
  let file = e.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
  if (!file && e.sitelinks?.enwiki) {
    const pg = Object.values((await getJSON(`https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&prop=pageimages&piprop=name&titles=${encodeURIComponent(e.sitelinks.enwiki.title)}`)).query.pages)[0];
    file = pg?.pageimage;
  }
  if (!file || !/\.jpe?g$/i.test(file)) return null;
  // Ask for a standard thumbnail width: those are pre-rendered on Wikimedia's CDN, custom widths take ~15s.
  const info = Object.values((await getJSON(`https://commons.wikimedia.org/w/api.php?format=json&origin=*&action=query&prop=imageinfo&iiprop=url&iiurlwidth=960&titles=${encodeURIComponent('File:' + file)}`)).query.pages)[0];
  const src = info?.imageinfo?.[0]?.thumburl;
  if (!src) return null;
  await preload(src);  // show it only once it's ready
  return { src, credit: info.imageinfo[0].descriptionurl };
}

/* City plus its state/region, e.g. "Hermosa Beach, California". MusicBrainz nests areas
   (city → county → state → country), so walk up a few levels to the first subdivision. */
async function resolvePlace(artist) {
  const area = artist['begin-area'] || artist.area;
  if (!area || ['Country', 'Subdivision'].includes(area.type)) return area?.name || '';
  let at = area;
  try {
    for (let hop = 0; hop < 4; hop++) {
      const a = await mb(`area/${at.id}?inc=area-rels`, { priority: true });
      const parent = (a.relations || []).find(r => r.type === 'part of' && r.direction === 'backward')?.area;
      if (!parent) break;
      if (parent.type === 'Subdivision' || parent.type === 'Country') return `${area.name}, ${parent.name}`;
      at = parent;
    }
  } catch {}
  return area.name;
}

/* ---------- Lineup timeline ---------- */
const ROLES = [
  { name: 'Vocals', color: '#f25f5c', test: a => /vocal|singer|rap|\bmc\b|voice/.test(a) },
  { name: 'Guitar', color: '#ffb238', test: a => /guitar|banjo|mandolin/.test(a) && !/bass/.test(a) },
  { name: 'Bass', color: '#5cc8ff', test: a => /bass/.test(a) },
  { name: 'Drums', color: '#7be495', test: a => /drum|percussion|membranophone|idiophone|cymbal/.test(a) },
  { name: 'Keys', color: '#b58cff', test: a => /key|piano|synth|organ|electronic/.test(a) },
  { name: 'Other', color: '#8b91a1', test: () => true },

const NON_ROLES = ['original', 'founder', 'additional', 'minor', 'guest', 'lead', 'solo', 'background', 'touring'];
// Main role first: lead vocals, then instruments, then backing vocals.
function rolesOf(attrs) {
  const ranked = new Map();
  for (const a of attrs.map(x => x.toLowerCase()).filter(x => !NON_ROLES.includes(x))) {
    const i = ROLES.findIndex(r => r.test(a));
    const rank = /lead/.test(a) ? -1 : /background|backing|additional/.test(a) ? 10 + i : i;
    ranked.set(ROLES[i], Math.min(rank, ranked.get(ROLES[i]) ?? 99));
  }
  const list = [...ranked].sort((a, b) => a[1] - b[1]).map(([r]) => r);
  return list.length ? list : [ROLES.at(-1)];
}
// '1987' -> 1987.0 (or 1988.0 as an end), '1987-05' -> 1987.33, etc.
function toYear(date, isEnd) {
  if (!date) return null;
  const [y, m, d] = date.split('-').map(Number);
  if (!m) return y + (isEnd ? 1 : 0);
  if (!d) return y + (m - (isEnd ? 0 : 1)) / 12;
  return y + (m - 1) / 12 + (d - 1) / 365;
}
const NOW = (() => { const d = new Date(); return d.getFullYear() + d.getMonth() / 12 + d.getDate() / 365; })();

function rootSpan() {
  const ls = state.artist['life-span'] || {};
  // For a band, missing dates fall back to the band's own lifespan; for a person, their birth date is meaningless here.
  return { rootStart: kindOf(state.artist.type) === 'band' ? toYear(ls.begin) : null, rootEnd: ls.ended ? toYear(ls.end, true) ?? NOW : NOW };
}
function stintsOf(r) {
  const { rootStart, rootEnd } = rootSpan();
  return r.periods.filter(p => p.begin || p.end).map(p => {
    const start = toYear(p.begin) ?? rootStart ?? toYear(p.end) - 1;
    const end = toYear(p.end, true) ?? (p.begin && !p.ended ? NOW : rootEnd);
    // No role on the stint or the member: use what they play on the records, so the bar isn't grey "Other".
    const own = p.attrs.filter(x => !['original', 'founder', 'additional', 'minor', 'guest', 'touring'].includes(String(x).toLowerCase()) && normRole(x) !== 'performer');   // "original" or "founder" alone isn't a role
    return { start, end: Math.max(end, start + 1 / 12), p, roles: rolesOf(own.length ? own : r.attrs.size ? [...r.attrs] : r.instruments || []) };
  });
}
function renderTimeline() {
  const el = document.getElementById('timeline');
  if (!el || !state.artist || state.artist.type === 'Album') return;   // album pages show the tracklist here
  const here = stages.get(trail[cur]?.id);
  document.getElementById('tlTitle').textContent = `${kindOf(state.artist.type) === 'band' ? 'Lineup timeline' : 'Band timeline'} · ${state.artist.name}`;
  if (!state.rels.length) {
    el.innerHTML = `<span class="muted">No ${kindOf(state.artist.type) === 'band' ? 'member' : 'band membership'} data for this artist yet.</span>`;
    document.getElementById('tlegend').innerHTML = '';
    return;
  }
  const artist = state.artist, isBand = kindOf(artist.type) === 'band';
  const { rootStart, rootEnd } = rootSpan();

  const rows = [], undated = [];
  for (const r of state.rels) {
    const bars = stintsOf(r);
    if (bars.length) rows.push({ r, bars, first: Math.min(...bars.map(b => b.start)) }); else undated.push(r);
  }
  rows.sort((a, b) => a.first - b.first || a.r.name.localeCompare(b.r.name));

  const albums = state.releases.filter(rg => ['Album', 'EP'].includes(relType(rg)) && rg['first-release-date'])
    .map(rg => ({ rg, ep: relType(rg) === 'EP', at: toYear(rg['first-release-date']) + 1 / 24 }));
  // Undated members go underneath as their own rows.
  undated.sort((a, b) => a.name.localeCompare(b.name)).forEach(r => rows.push({ r, bars: [], undated: true }));
  const all = rows.flatMap(r => r.bars);
  // With no dated stints at all, fall back to the band's own lifespan for the axis (or drop the axis).
  const y0 = Math.floor(Math.min(...all.map(b => b.start), rootStart ?? Infinity));
  // Run the axis to today only if someone's still in the band (or the band itself is); otherwise stop at the last stint.
  // (MusicBrainz often just leaves a band's end date blank, so "not ended" alone doesn't mean still active.)
  const open = state.rels.some(r => r.periods.some(p => (p.begin || p.end) && !p.end && !p.ended));
  const y1_ = Math.ceil(Math.max(...all.map(b => b.end), open ? NOW : (state.artist['life-span'] || {}).ended ? rootEnd : -Infinity));
  // Stretch to take in a record released up to 3 years after the last stint (the EP that came out after the split).
  const y1 = Math.max(y1_, ...albums.filter(a => a.at > y1_ && a.at <= y1_ + 3).map(a => Math.ceil(a.at)));
  const hasAxis = isFinite(y0) && isFinite(y1) && y1 > y0;
  const W = el.clientWidth, labelW = Math.min(170, W * 0.32), rowH = 26, axisH = hasAxis ? 26 : 4;
  const H = rows.length * rowH + axisH;
  const x = d3.scaleLinear(hasAxis ? [y0, y1] : [0, 1], [labelW, W - 4]);

  el.innerHTML = '';
  const svg = d3.select(el).append('svg').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`);
  const ticks = hasAxis ? x.ticks(Math.min(y1 - y0, Math.floor((W - labelW) / 55))).filter(Number.isInteger) : [];
  svg.append('g').attr('class', 'grid').selectAll('line').data(ticks).join('line')
    .attr('x1', x).attr('x2', x).attr('y1', 0).attr('y2', H - axisH + 4);
  svg.append('g').attr('class', 'axis').selectAll('text').data(ticks).join('text')
    .attr('x', x).attr('y', H - 6).attr('text-anchor', 'middle').text(d => d);

  const tip = document.getElementById('tip'), wrap = el.parentElement;
  const showTip = (ev, html) => {
    tip.innerHTML = html; tip.style.display = 'block';
    const b = wrap.getBoundingClientRect(), tw = tip.offsetWidth;
    tip.style.left = Math.min(ev.clientX - b.left + 14, b.width - tw - 8) + 'px';
    tip.style.top = (ev.clientY - b.top + 14) + 'px';
  };
  const hideTip = () => tip.style.display = 'none';

  const row = svg.append('g').selectAll('g').data(rows).join('g').attr('transform', (d, i) => `translate(0,${i * rowH})`);
  row.append('text').attr('class', 'name').attr('x', labelW - 12).attr('y', rowH / 2).attr('dy', '.35em')
    .attr('text-anchor', 'end').text(d => d.r.name.length > 24 ? d.r.name.slice(0, 23) + '…' : d.r.name)
    .on('click', (ev, d) => selectMember(d.r.id));
  // Gaps between one person's stints: keep the line going (same colours, faded) so it reads as one run with a break.
  const gaps = d => { const bs = [...d.bars].sort((a, b) => a.start - b.start); return bs.slice(1).map((b, k) => ({ from: bs[k].end, to: b.start, prev: bs[k], next: b, r: d.r })).filter(g => g.to > g.from); };
  const gap = row.selectAll('g.gap').data(gaps).join('g').attr('class', 'gap')
    .on('mousemove', (ev, g) => showTip(ev, `<b>${esc(g.r.name)}</b><br>${esc(g.r.periods.filter(p => p.begin || p.end).map(fmtPeriod).join(', '))}<br><span class="muted">Between reunions or breaks, ${Math.floor(g.from)}–${Math.floor(g.to)}</span>`)).on('mouseleave', hideTip)
    .on('click', (ev, g) => selectMember(g.r.id));
  gap.append('rect').attr('x', g => x(g.prev.start) + 3).attr('width', g => Math.max(0, x(g.next.end) - x(g.prev.start) - 6)).attr('y', 5).attr('height', rowH - 10)
    .attr('fill', g => g.prev.roles[0].color).attr('fill-opacity', g => g.prev.p.fromRecords || g.prev.p.fromBand ? .45 : 1);
  gap.filter(g => g.prev.roles[1]).append('rect').attr('x', g => x(g.from)).attr('width', g => Math.max(0, x(g.to) - x(g.from)))
    .attr('y', rowH / 2 - 2).attr('height', 4).attr('fill', g => g.prev.roles[1].color).attr('fill-opacity', 1);
  const bar = row.selectAll('g.bar').data(d => d.bars.map(b => ({ ...b, r: d.r }))).join('g').attr('class', 'bar')
    .on('mousemove', (ev, b) => showTip(ev, `<b>${esc(b.r.name)}</b><br>${esc(fmtPeriod(b.p))}${b.p.fromRecords ? ' <span class="muted">(from album credits)</span>' : b.p.fromBand ? ' <span class="muted">(the band’s years)</span>' : ''}<br>
        <span class="muted">${esc(b.p.attrs.filter(a => !['original'].includes(a)).join(', ') || [...b.r.attrs].join(', ') || 'role unknown')}</span>`))
    .on('mouseleave', hideTip).on('click', (ev, b) => selectMember(b.r.id));
  bar.append('rect').attr('x', b => x(b.start)).attr('width', b => Math.max(3, x(b.end) - x(b.start)))
    .attr('y', 5).attr('height', rowH - 10).attr('rx', 3).attr('fill', b => b.roles[0].color).attr('fill-opacity', b => b.p.fromRecords || b.p.fromBand ? .45 : 1);
  const und = row.filter(d => d.undated);
  und.append('line').attr('x1', labelW).attr('x2', W - 4).attr('y1', rowH / 2).attr('y2', rowH / 2)
    .attr('stroke', 'var(--muted)').attr('stroke-opacity', .5).attr('stroke-dasharray', '4 4');
  und.append('rect').attr('x', labelW).attr('y', 4).attr('width', 104).attr('height', rowH - 8).attr('fill', 'var(--panel)');
  und.append('text').attr('x', labelW + 4).attr('y', rowH / 2).attr('dy', '.35em').attr('fill', 'var(--muted)')
    .attr('font-size', 12).attr('font-style', 'italic').text('dates unknown');
  // Secondary role as a stripe through the middle, like Wikipedia's lineup charts.
  bar.filter(b => b.roles[1]).append('rect').attr('x', b => x(b.start)).attr('width', b => Math.max(3, x(b.end) - x(b.start)))
    .attr('y', rowH / 2 - 2).attr('height', 4).attr('fill', b => b.roles[1].color);

  const alb = svg.append('g').selectAll('g').data(hasAxis ? albums.filter(a => a.at >= y0 && a.at <= y1) : []).join('g').attr('class', 'album')
    .on('mousemove', (ev, a) => showTip(ev, `<b>${esc(a.rg.title)}</b><br><span class="muted">${a.ep ? 'EP' : 'Album'} · ${esc(a.rg['first-release-date'])}</span>`))
    .on('mouseleave', hideTip);
  alb.append('line').attr('class', a => a.ep ? 'vis ep' : 'vis').attr('x1', a => x(a.at)).attr('x2', a => x(a.at)).attr('y1', 0).attr('y2', H - axisH + 4);
  alb.append('line').attr('x1', a => x(a.at)).attr('x2', a => x(a.at)).attr('y1', 0).attr('y2', H - axisH + 4)
    .attr('stroke', 'transparent').attr('stroke-width', 8);

  const used = ROLES.filter(R => rows.some(r => r.bars.some(b => b.roles.includes(R))));
  document.getElementById('tlegend').innerHTML = used.map(R => `<span><i style="background:${R.color}"></i>${R.name}</span>`).join('')
    + (albums.length && hasAxis ? `<span><i style="background:none;border-left:1px dashed #fff8;border-radius:0;width:1px"></i>${albums.some(a => a.ep) ? 'Album / EP' : 'Studio album'}</span>` : '')
    + (used.length ? `<span>Center stripe = second role</span>` : '')

}
function fmtPeriod(p) {

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderTimeline(); renderNav(); }, 150); });

/* ---------- Discography ---------- */
const TYPES = ['Album', 'EP', 'Single', 'Live', 'Compilation', 'Other', 'All'];
const LABELS = { Album: 'Albums', EP: 'EPs', Single: 'Singles', Live: 'Live', Compilation: 'Compilations', Other: 'Other', All: 'All' };
function relType(rg) {
  const sec = rg['secondary-types'] || [];
  if (sec.includes('Live')) return 'Live';
  if (sec.includes('Compilation')) return 'Compilation';
  if (sec.length) return 'Other';
  return ['Album', 'EP', 'Single'].includes(rg['primary-type']) ? rg['primary-type'] : 'Other';
}
async function loadReleases(st, myGen) {
  let all = [];
  try {
    if (st.artist.src === 'mb') for (let offset = 0; offset < 1000; offset += 100) {
      const d = await mb(`release-group?artist=${st.id}&limit=100&offset=${offset}`, { gen: myGen });
      all.push(...d['release-groups']);
      if (all.length >= d['release-group-count'] || !d['release-groups'].length) break;
    }
    // A musician who mostly records with bands: add their bands' albums and EPs from while they were in them.
    if (st.kind === 'person' && all.filter(r => ['Album', 'EP'].includes(relType(r))).length < 3) {
      await st.ready;
      for (const b of st.rels.filter(r => !r.id.includes(':')).sort(byCareer).slice(0, 12)) {
        const d = await mb(`release-group?artist=${b.id}&type=album|ep&limit=100`, { gen: myGen }).catch(e => { if (e.message === 'stale') throw e; return null; });
        const ys = b.periods.map(p => [+year(p.begin) || 0, +year(p.end) || 9999]).filter(([x]) => x);
        for (const rg of d?.['release-groups'] || []) {
          const y = +year(rg['first-release-date']) || 0;
          if ((rg['secondary-types'] || []).length) continue;   // studio records only, no live albums or compilations
          if (ys.length && y && !ys.some(([a, z]) => y >= a - 1 && y <= z + 1)) continue;
          if (!all.some(x => x.id === rg.id)) all.push({ ...rg, band: b.name, bandId: b.id });
        }
        // Still no dates for them in this band: the years of the band's records stand in (drawn faded).
        if (!b.periods.some(p => p.begin || p.end)) {
          const yrs = (d?.['release-groups'] || []).map(rg => +year(rg['first-release-date'])).filter(Boolean).sort((x, z) => x - z);
          if (yrs.length) { b.periods = [{ begin: String(yrs[0]), end: String(yrs.at(-1)), ended: true, attrs: [], fromBand: true }]; st.rels = finalizeRels(st.rels); }
        }
      }
    }
    // Discogs last: it rate-limits hard, so it only stands in when MusicBrainz and the bands' records gave us nothing.
    if (!all.length && st.discogsId) all = await discogsReleases(st.discogsId, myGen).catch(e => { if (e.message === 'stale') throw e; return []; });
  } catch (e) { if (e.message === 'stale') return; }
  st.releases = all.sort((a, b) => (a['first-release-date'] || '9999').localeCompare(b['first-release-date'] || '9999'));

  maybeBandCredits(st);

async function discogsReleases(did, myGen) {
  const out = [];
  for (let page = 1; page <= 5; page++) {
    const d = await dg(`artists/${did}/releases?sort=year&sort_order=asc&per_page=100&page=${page}`, { gen: myGen });
    for (const r of d.releases || []) {
      if (r.role !== 'Main') continue;
      const f = r.format || '';
      out.push({ id: `dg-${r.type}-${r.id}`, src: 'discogs', dgType: r.type, dgId: r.id, title: r.title, thumb: r.thumb || '',

    if (!r.ok) throw new Error('itunes ' + r.status);
    const hit = bestMatch((await r.json()).results, artist, title, x => x.artistName, x => x.collectionName);
    if (hit || !artist) return hit || null;

    const a = await throttled('itunes', () => fetch(`https://itunes.apple.com/search?entity=musicArtist&limit=5&term=${encodeURIComponent(artist)}`), 1500).then(r => r.json());
    const who = a.results.find(x => bare(x.artistName) === bare(artist));

// Deezer's API has no CORS headers but supports JSONP.
function jsonp(url) {
  return new Promise((ok, fail) => {
    const cb = 'jp' + Math.random().toString(36).slice(2), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); fail(new Error('timeout')); }, 8000);
    window[cb] = d => { done(); ok(d); };
    s.onerror = () => { done(); fail(new Error('jsonp')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;

const dgImage = m => ((m.images || []).find(i => i.type === 'primary') || m.images?.[0])?.uri || '';
async function fromDiscogs(artist, title, rg) {

  for (const type of ['master', 'release']) {
    const res = await dg(`database/search?type=${type}&per_page=10&artist=${encodeURIComponent(artist)}&release_title=${encodeURIComponent(title)}`, { gen });
    // Search titles look like "Artist - Title".
    const hit = bestMatch(res.results || [], artist, title, x => x.title.split(' - ')[0], x => x.title.split(' - ').slice(1).join(' - '));
    if (!hit) continue;
    if (hit.cover_image && !hit.cover_image.includes('spacer.gif')) return hit.cover_image;
    return dgImage(await dg(`${type}s/${hit.id}`, { gen }));

  const res = await dg(`database/search?per_page=10&q=${encodeURIComponent(artist + ' ' + title)}`, { gen });
  const hit = bestMatch((res.results || []).filter(x => x.type === 'master' || x.type === 'release'), artist, title,
    x => x.title.split(' - ')[0], x => x.title.split(' - ').slice(1).join(' - '));

    const sources = [() => fromItunes(artist, title), () => fromDeezer(artist, title), () => fromWikipedia(artist, title),
      () => fromOtherEditions(rgId), () => fromDiscogs(artist, title, rg)];
    if (rg?.src === 'discogs') sources.unshift(sources.pop());   // it's a Discogs release: ask Discogs directly first
    let unsure = false;
    for (const source of sources) {
      if (!card.isConnected) return;   // re-rendered or navigated away: the new card will pick this up
      try { url = await source(); } catch { unsure = true; url = ''; }
      if (url) break;
    }
    // Only remember a miss if every source actually answered.
    if (url || !unsure) try { localStorage.setItem(key, url); } catch {}
  }
  if (!url || !card.isConnected) return;
  const i = new Image(); i.alt = ''; i.src = url; i.onerror = () => i.remove(); card.appendChild(i);
}
function setDiscogsToken() {
  const t = prompt('Paste a Discogs personal access token to speed up Discogs lookups (members and covers for obscure releases).\nGet one free at discogs.com/settings/developers. It is stored only in this browser.\n\nLeave empty to remove it.', discogsToken());
  if (t === null) return;
  try { t.trim() ? localStorage.setItem('discogsToken', t.trim()) : localStorage.removeItem('discogsToken'); } catch {}
  renderReleases();
}

/* ---------- Boot ---------- */
route(location.hash.slice(1));
</script>
